<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>避錯寶 Bitrobo - ROI計算器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #ff6b6b, #ff8e53);
            color: white;
            padding: 30px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        
        .header p {
            font-size: 1.2em;
            opacity: 0.9;
        }
        
        .main-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0;
        }
        
        .calculator-section {
            padding: 40px;
            background: #f8f9fa;
        }
        
        .results-section {
            padding: 40px;
            background: white;
        }
        
        .form-group {
            margin-bottom: 25px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #333;
        }
        
        .form-group input, .form-group select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        
        .form-group input:focus, .form-group select:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .calculate-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.3s;
        }
        
        .calculate-btn:hover {
            transform: translateY(-2px);
        }
        
        .result-card {
            background: linear-gradient(135deg, #ff6b6b, #ff8e53);
            color: white;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            text-align: center;
        }
        
        .result-card h3 {
            font-size: 1.5em;
            margin-bottom: 10px;
        }
        
        .result-card .value {
            font-size: 2.5em;
            font-weight: bold;
            margin-bottom: 5px;
        }
        
        .market-stats {
            background: #f8f9fa;
            padding: 30px;
            margin-top: 30px;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        
        .stat-item {
            background: white;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        
        .stat-item h4 {
            color: #667eea;
            margin-bottom: 10px;
        }
        
        .stat-item .number {
            font-size: 1.8em;
            font-weight: bold;
            color: #333;
        }
        
        @media (max-width: 768px) {
            .main-content {
                grid-template-columns: 1fr;
            }
            
            .header h1 {
                font-size: 2em;
            }
            
            .calculator-section, .results-section {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎯 避錯寶 Bitrobo</h1>
            <p>AI驅動的代購庫存管理解決方案 - ROI計算器</p>
        </div>
        
        <div class="main-content">
            <div class="calculator-section">
                <h2>📊 請輸入您的商店資訊</h2>
                
                <div class="form-group">
                    <label>商店類型</label>
                    <select id="storeType">
                        <option value="small">小型個人賣家（微型電商）</option>
                        <option value="medium">中型美妝選物店</option>
                        <option value="custom">自訂數值</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label>目前月庫存成本（台幣）</label>
                    <input type="number" id="inventoryCost" placeholder="例：50000" min="0">
                </div>
                
                <div class="form-group">
                    <label>主要銷售品類</label>
                    <select id="category">
                        <option value="cosmetics">美妝保養</option>
                        <option value="shoes">球鞋運動</option>
                        <option value="3c">3C配件</option>
                        <option value="fashion">服飾配件</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label>目前庫存周轉天數</label>
                    <input type="number" id="turnoverDays" placeholder="例：30" min="1">
                </div>
                
                <div class="form-group">
                    <label>預期成本降低比例（%）</label>
                    <input type="number" id="costReduction" value="20" min="1" max="50">
                </div>
                
                <button class="calculate-btn" onclick="calculateROI()">
                    🚀 計算投資報酬率
                </button>
            </div>
            
            <div class="results-section">
                <h2>💰 投資報酬率分析</h2>
                
                <div id="results">
                    <div class="result-card">
                        <h3>月度成本節省</h3>
                        <div class="value" id="monthlySavings">-</div>
                        <div>台幣</div>
                    </div>
                    
                    <div class="result-card">
                        <h3>避錯寶月費用</h3>
                        <div class="value" id="monthlyFee">-</div>
                        <div>台幣</div>
                    </div>
                    
                    <div class="result-card">
                        <h3>投資報酬率</h3>
                        <div class="value" id="roiPercentage">-</div>
                        <div>%</div>
                    </div>
                    
                    <div class="result-card">
                        <h3>年度總節省</h3>
                        <div class="value" id="annualSavings">-</div>
                        <div>台幣</div>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="market-stats">
            <h2>📈 台灣代購市場數據</h2>
            <div class="stats-grid">
                <div class="stat-item">
                    <h4>總可尋址市場</h4>
                    <div class="number">132億</div>
                    <small>台灣網路化妝品市場</small>
                </div>
                <div class="stat-item">
                    <h4>可服務市場</h4>
                    <div class="number">80.5億</div>
                    <small>蝦皮平台市場規模</small>
                </div>
                <div class="stat-item">
                    <h4>美妝賣家數量</h4>
                    <div class="number">8,760</div>
                    <small>潛在客戶基數</small>
                </div>
                <div class="stat-item">
                    <h4>蝦皮月訂單</h4>
                    <div class="number">800萬</div>
                    <small>市場活躍度</small>
                </div>
                <div class="stat-item">
                    <h4>美妝商品數</h4>
                    <div class="number">438萬</div>
                    <small>商品豐富度</small>
                </div>
                <div class="stat-item">
                    <h4>AI預測準確度</h4>
                    <div class="number">+4%</div>
                    <small>優於傳統LSTM模型</small>
                </div>
            </div>
        </div>
    </div>

    <script>
        function calculateROI() {
            const storeType = document.getElementById('storeType').value;
            const inventoryCost = parseFloat(document.getElementById('inventoryCost').value) || 0;
            const category = document.getElementById('category').value;
            const turnoverDays = parseFloat(document.getElementById('turnoverDays').value) || 30;
            const costReduction = parseFloat(document.getElementById('costReduction').value) || 20;
            
            // 根據商店類型設定預設值
            let defaultCost = inventoryCost;
            if (storeType === 'small' && inventoryCost === 0) {
                defaultCost = 55000; // 小型店家平均值
            } else if (storeType === 'medium' && inventoryCost === 0) {
                defaultCost = 300000; // 中型店家平均值
            }
            
            const actualCost = inventoryCost || defaultCost;
            
            // 計算成本節省
            const monthlySavings = actualCost * (costReduction / 100);
            
            // 計算月費用（15%收費模式）
            const monthlyFee = monthlySavings * 0.15;
            
            // 計算ROI
            const roiPercentage = ((monthlySavings - monthlyFee) / monthlyFee) * 100;
            
            // 計算年度總節省
            const annualSavings = (monthlySavings - monthlyFee) * 12;
            
            // 更新顯示
            document.getElementById('monthlySavings').textContent = monthlySavings.toLocaleString('zh-TW');
            document.getElementById('monthlyFee').textContent = monthlyFee.toLocaleString('zh-TW');
            document.getElementById('roiPercentage').textContent = roiPercentage.toFixed(0);
            document.getElementById('annualSavings').textContent = annualSavings.toLocaleString('zh-TW');
            
            // 更新庫存成本輸入框（如果為空）
            if (inventoryCost === 0) {
                document.getElementById('inventoryCost').value = actualCost;
            }
        }
        
        // 商店類型變更時更新預設值
        document.getElementById('storeType').addEventListener('change', function() {
            const storeType = this.value;
            const inventoryCostInput = document.getElementById('inventoryCost');
            
            if (storeType === 'small') {
                inventoryCostInput.placeholder = '建議範圍：10,000 - 100,000';
            } else if (storeType === 'medium') {
                inventoryCostInput.placeholder = '建議範圍：100,000 - 500,000';
            } else {
                inventoryCostInput.placeholder = '請輸入您的實際庫存成本';
            }
        });
        
        // 初始計算
        calculateROI();
    </script>
</body>
</html>
