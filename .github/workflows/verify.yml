name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Pinned to a full commit sha, with the release tag alongside for humans.
      #
      # This file previously argued that a first-party action could be pinned to
      # its major tag because it came from a trusted source. Provenance is not
      # the property that matters: a tag is a mutable pointer, and `@v7` naming a
      # different tree tomorrow produces no diff anywhere in this repository. The
      # question a pin answers is "is this the code I reviewed", and only a
      # commit sha answers it. tests/unit/workflows.test.mts enforces this on
      # every workflow file, so the rule cannot rot back the way that argument
      # did.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # THE PINNED VERSION, not the newest 24.x. This said `'24'` and that
          # floated: CI resolved 24.20.0 while .node-version says 24.13.0, and
          # the two ship DIFFERENT UNICODE VERSIONS -- 17.0 against 16.0. The
          # width table is generated from UCD extracts chosen to match
          # `process.versions.unicode`, because the other half of that model is
          # the engine's own \p{Mn}/\p{Me}/\p{Cf} escapes, so a floating engine
          # silently pairs a 16.0 table with 17.0 escapes.
          #
          # It did not go silent -- the cell-width suite failed by name, which is
          # what it is for -- but a required gate that breaks when a patch
          # release lands is a gate that will be muted. Reading the pin means CI
          # tests the engine this repository says it is tested on.
          node-version-file: .node-version
          cache: npm

      - run: npm ci

      # ONE step, calling the same script a developer runs. Listing the gates
      # again here created two copies of one list, and the copy in this file had
      # already rotted — it ran five of the seven gates while its own comment
      # claimed to run every gate the repo has. That is the exact failure the
      # rest of this repository is built to prevent, so the list lives in
      # package.json and nowhere else.
      #
      # `npm run verify` is now hermetic. It used to end in `truth:check`, a live
      # query against api.github.com and builds.dotnet.microsoft.com, which meant
      # a required gate could go red because a shared runner IP had exhausted its
      # rate budget — a failure with nothing to do with the change under test. It
      # now ends in `truth:verify`, which proves the committed lockfile is
      # schema-valid, untampered, internally coherent and free of error-severity
      # discrepancies, and says out loud that it did not ask upstream anything.
      # Asking upstream is upstream-sync.yml's job, on a schedule, where a rate
      # limit is information rather than a blocked pull request.
      - name: verify
        run: npm run verify
