/* 放不下就改用清單格式(等同 PowerShell 的 Format-List),欄位才不會因換行而錯位 */
function listFormat(headers,rows){
  const hw=Math.max.apply(null,headers.map(dw));
  const o=[];
  rows.forEach(function(r,idx){
    if(idx) o.push(line(''));
    headers.forEach(function(h,i){
      const label=padw(h,hw), value=String(r[i]);
      o.push({kv:[label,value], txt:label+' : '+value, indent:hw+3});   // 續行懸掛縮排到值的起點
    });
  });
  return o;
}
function table(headers,rows){
  let w=headers.map(function(h,i){return Math.max.apply(null,[dw(h)].concat(rows.map(function(r){return dw(String(r[i]));})));});
  const total=w.reduce(function(a,b){return a+b;},0)+2*(w.length-1);
  if(total>availCols() && rows.length<=12) return listFormat(headers,rows);
  let H=headers.map(function(h,i){return padw(h,w[i]);}).join('  ');
  let R=w.map(function(x){return new Array(x+1).join('-');}).join('  ');
  let o=[{cls:'head',txt:H},{cls:'rule',txt:R}];
  rows.forEach(function(r){o.push({cls:'',txt:r.map(function(c,i){return padw(c,w[i]);}).join('  ')});});
  return o;
}

function idHref(id){
  if(!id) return '';
  if(/^arxiv:/i.test(id)) return 'https://arxiv.org/abs/'+String(id).replace(/^arXiv:/i,'');
  if(/^10\./.test(id)) return 'https://doi.org/'+id;
  return '';

/* ---------- 虛擬檔案系統(可讀寫 · localStorage 持久化)----------
   架構參考 ZenFS / BrowserFS 與 daedalOS 的 overlay 模型:
   唯讀「種子」作品集樹 + 使用者可寫層,序列化時種子檔只存標記,載入時再水合。 */
/* FSKEY 帶版本:fsLoad() 會整棵覆蓋 ROOT,舊訪客的存檔不會長出新的種子檔。
   每次新增/更名種子內容就進版,讓回訪者拿到新的樹(代價是清掉他自己建的檔)。 */

function slug(s){return String(s).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'');}
let SEEDROWS={}, ROOT=null;
/* ch 用 null 原型的字典:檔名 __proto__ 才會變成正常的項目,
   而不是去改寫物件的原型(那會讓該目錄的結構整個壞掉)。 */
function dnode(){return {t:'d',ch:Object.create(null)};}
const FLAGRE=/^-{1,2}[A-Za-z]/;   /* 只有 -Name 這種才算參數;-1 是負數值,不是參數 */
function joinPath(dir,name){ return String(dir).replace(/\\+$/,'')+'\\'+name; }
function dirOf(p){ const s=segsOf(p); return 'C:\\'+s.slice(0,-1).join('\\'); }
function normPath(p){ return String(p).replace(/\\+$/,'').toLowerCase(); }
function samePath(a,b){ return normPath(a)===normPath(b); }
function isDescendant(child,ancestor){ return normPath(child).indexOf(normPath(ancestor)+'\\')===0; }
/* 所有寫入都走這裡:大小寫不同的同名視為同一個項目,避免出現 README.md 與 readme.md 並存 */
function setChild(parent,name,node){
  const ex=keyIn(parent,name);
  if(ex) delete parent.ch[ex];
  parent.ch[name]=node;
}
function fnode(rows,seed,text){return {t:'f',rows:rows||null,seed:!!seed,text:text||null};}
function segsOf(p){ let m=String(p).match(/^[A-Za-z]:\\?([\s\S]*)$/), s=m?m[1]:String(p);
  return s.split('\\').filter(function(x){return x && x!=='.';}); }
function keyIn(n,name){ if(!n||n.t!=='d') return null; let k=Object.keys(n.ch),i,l=String(name).toLowerCase();
  for(i=0;i<k.length;i++){ if(k[i].toLowerCase()===l) return k[i]; } return null; }
function fsGet(path){
  const dm=String(path).match(/^([A-Za-z]):/);
  if(dm && dm[1].toUpperCase()!=='C') return null;   // 只有 C: 存在,別的磁碟不可靜默對映到 C:
  let segs=segsOf(path), n=ROOT,i;
  for(i=0;i<segs.length;i++){ let k=keyIn(n,segs[i]); if(!k) return null; n=n.ch[k]; }
  return n; }
function fsCanon(path){ let segs=segsOf(path), n=ROOT, o=[],i;
  for(i=0;i<segs.length;i++){ let k=keyIn(n,segs[i]); if(!k) return null; o.push(k); n=n.ch[k]; }
  return 'C:\\'+o.join('\\'); }
function fsParent(path){ let segs=segsOf(path); if(!segs.length) return null; return fsGet('C:\\'+segs.slice(0,-1).join('\\')); }
function baseOf(path){ let s=segsOf(path); return s.length?s[s.length-1]:''; }
function fsMkdirp(path){ let segs=segsOf(path), n=ROOT,i;
  for(i=0;i<segs.length;i++){ let k=keyIn(n,segs[i]);
    if(!k){ n.ch[segs[i]]=dnode(); k=segs[i]; }
    n=n.ch[k]; if(n.t!=='d') return null; }
  return n; }
function fsClone(n){ if(n.t==='d'){ const o=dnode(); Object.keys(n.ch).forEach(function(k){ o.ch[k]=fsClone(n.ch[k]); }); return o; }
  return fnode(n.rows,n.seed,n.text?n.text.slice():null); }
function fsText(n){ if(!n||n.t!=='f') return [];
  if(n.rows) return n.rows;
  return (n.text||[]).map(function(s){return line('',s);}); }
function resolvePath(p){
  if(p==null||p==='') return CWD;
  p=String(p).replace(/^["']|["']$/g,'').replace(/\//g,'\\');
  if(p==='~') return HOME;
  let abs;
  if(p.indexOf('~\\')===0) abs=HOME+'\\'+p.slice(2);
  else if(/^[A-Za-z]:/.test(p)) abs=p;
  else if(p.charAt(0)==='\\') abs='C:'+p;
  else abs=CWD+'\\'+p;
  let m=abs.match(/^([A-Za-z]):\\?([\s\S]*)$/);
  if(!m) return abs;
  let segs=m[2].split('\\'), o=[], i;
  for(i=0;i<segs.length;i++){ let s=segs[i];
    if(!s||s==='.') continue;
    if(s==='..'){ o.pop(); continue; }
    o.push(s); }
  return m[1].toUpperCase()+':\\'+o.join('\\');
}
function pathCandidates(){ let n=fsGet(CWD); if(!n||n.t!=='d') return [];
  return Object.keys(n.ch).concat(['..','~']); }
function argOf(a,n){ let k=Object.keys(a),i; for(i=0;i<k.length;i++){ if(k[i].toLowerCase()===String(n).toLowerCase()) return a[k[i]]; } return undefined; }
function firstArg(raw){ for(let i=1;i<raw.length;i++){ if(!/^-/.test(raw[i])) return String(raw[i]).replace(/^["']|["']$/g,''); } return ''; }

function fsSer(n){ if(n.t==='d'){ const o={t:'d',ch:{}}; Object.keys(n.ch).forEach(function(k){ o.ch[k]=fsSer(n.ch[k]); }); return o; }
  return n.seed?{t:'f',s:1}:{t:'f',x:n.text||[]}; }
function isSerNode(v){ if(!v||typeof v!=='object') return false;
  if(v.t==='f') return v.s===1 || Array.isArray(v.x);
  if(v.t==='d') return !!v.ch && typeof v.ch==='object' && !Array.isArray(v.ch);
  return false; }
function fsDeser(o,path){ if(o.t==='d'){ const n=dnode();
    Object.keys(o.ch).forEach(function(k){ if(isSerNode(o.ch[k])) n.ch[k]=fsDeser(o.ch[k],path+'\\'+k); }); return n; }
  if(o.s) return fnode(SEEDROWS[path.toLowerCase()]||[line('muted','(seed content unavailable)')],true);
  return fnode(null,false,o.x||[]); }
/* 儲存失敗(配額用盡、隱私模式)不能悄悄吞掉 —— 使用者會以為存好了,重整後才發現不見。 */
function fsSave(){
  try{ localStorage.setItem(FSKEY,JSON.stringify(fsSer(ROOT))); return null; }
  catch(e){ return line('err','警告: 變更只存在於記憶體,無法寫入瀏覽器儲存空間 ('+((e&&e.name)||'StorageError')+')。重新整理後會消失。'); }
}
function saved(rows){ const w=fsSave(); if(!w) return rows; return (rows||[]).concat([w]); }
/* 真正的 overlay:種子樹每次開機都重建成「這一版」的內容,localStorage 只回填
   使用者自己建立或改過的節點。否則作品集更新後,曾經造訪過的人會永遠停在舊樹,
   看不到新增的檔案(例如 in-review.md)。
   取捨:使用者刪掉種子檔後重新載入會復原 —— 作品集內容以站上這一版為準,
   使用者自己建立的檔案則完整保留。要全部歸零請用 Reset-FileSystem。 */
function graftUser(stored,target){
  if(!stored||stored.t!=='d'||!target||target.t!=='d') return;
  Object.keys(stored.ch).forEach(function(k){
    const s=stored.ch[k], ek=keyIn(target,k);
    if(s.t==='f'){ if(!s.seed) target.ch[ek||k]=s; return; }   // 只回填非種子檔(含被改寫過的種子檔)
    if(!ek) target.ch[k]=dnode();                              // 使用者建立的資料夾
    graftUser(s, target.ch[ek||k]);
  });
}
function fsLoad(){ try{ const s=localStorage.getItem(FSKEY); if(!s) return false;
  const o=JSON.parse(s); if(!o||o.t!=='d') return false;
  graftUser(fsDeser(o,'C:'), ROOT); return true; }catch(e){ return false; } }
function fsReset(){ buildSeed(); try{ localStorage.removeItem(FSKEY); }catch(e){} CWD=HOME; updatePrompt(); }
function fsInit(){ buildSeed(); fsLoad(); if(!fsGet(HOME)) buildSeed(); }

  'set-location':{params:['-Path'],paths:true,help:'切換目錄 (cd)',run:function(a,raw){

  'set-content':{params:['-Path','-Value'],paths:true,help:'寫入檔案內容 (sc)',run:function(a,raw){
    let t=argOf(a,'Path')||firstArg(raw);

  'add-content':{params:['-Path','-Value'],paths:true,help:'附加檔案內容 (ac)',run:function(a,raw){
    let t=argOf(a,'Path')||firstArg(raw);

    v=String(v).replace(/^["']|["']$/g,'');
    const p=resolvePath(t), n=fsGet(p);
    if(!n){ const par=fsParent(p); if(!par||par.t!=='d') return [line('err','Add-Content: Could not find part of the path \''+p+'\'.')];

    if(n.t==='d') return [line('err','Add-Content: \''+p+'\' is a directory.')];
    if(n.seed){ n.seed=false; n.text=(n.rows||[]).map(function(r){return r.txt||'';}); n.rows=null; }
    n.text=(n.text||[]).concat([v]); return saved(null);}},
  'test-path':{params:['-Path'],paths:true,help:'測試路徑是否存在',run:function(a,raw){

  'new-item':{params:['-Path','-ItemType','-Force'],paths:true,help:'建立檔案或資料夾 (mkdir/ni)',run:function(a,raw){
    let t=argOf(a,'Path')||firstArg(raw);
    let head=String(raw[0]).toLowerCase();
    if(!t) return [line('err','New-Item: 缺少 -Path。例: New-Item demo -ItemType Directory')];
    let it=String(argOf(a,'ItemType')||'').toLowerCase();
    let wantDir = it.indexOf('dir')===0 || head==='mkdir' || head==='md';
    let p=resolvePath(t);
    if(fsGet(p)) return [line('err','New-Item: An item with the specified name \''+p+'\' already exists.')];
    let segs=segsOf(p);
    if(!segs.length) return [line('err','New-Item: 無效的路徑。')];
    let parentPath='C:\\'+segs.slice(0,-1).join('\\'), par=fsGet(parentPath);
    if(!par){ if(!wantDir && !argOf(a,'Force')) return [line('err','New-Item: Could not find part of the path \''+p+'\'.')];
      par=fsMkdirp(parentPath); }
    if(!par||par.t!=='d') return [line('err','New-Item: Could not find part of the path \''+p+'\'.')];
    let name=segs[segs.length-1];
    setChild(par,name, wantDir?dnode():fnode(null,false,[]));
    return saved([line('muted','    Directory: '+(fsCanon(parentPath)||'C:\\')),line('')]
      .concat(table(['Mode','Name'],[[wantDir?'d----':'-a---',name]])));}},
  'remove-item':{params:['-Path','-Recurse','-Force'],paths:true,help:'刪除檔案或資料夾 (rm/del)',run:function(a,raw){
    let t=argOf(a,'Path')||firstArg(raw);
    if(!t) return [line('err','Remove-Item: 缺少 -Path。')];
    let p=resolvePath(t), n=fsGet(p);
    if(!n) return [line('err','Remove-Item: Cannot find path \''+p+'\' because it does not exist.')];
    if(segsOf(p).length<2) return [line('err','Remove-Item: Access to the path \''+p+'\' is denied.')];
    if(n.t==='d' && Object.keys(n.ch).length && !(argOf(a,'Recurse')||argOf(a,'Force')))
      return [line('err','Remove-Item: The directory \''+baseOf(p)+'\' is not empty.'),
              line('muted','加 -Recurse 可以連同內容一起刪除。')];
    let par=fsParent(p), k=keyIn(par,baseOf(p));
    if(k) delete par.ch[k];
    if(samePath(CWD,p) || isDescendant(CWD,p)){ CWD=HOME; updatePrompt(); }   // 刪到自己所在的目錄就退回 HOME
    return saved(null);}},
  /* 目的地是既有資料夾時,真正的落點是「資料夾 + 來源名稱」;所有檢查都要針對這個落點。 */
  'copy-item':{params:['-Path','-Destination','-Recurse'],paths:true,help:'複製項目 (cp)',run:function(a,raw){
    const s=argOf(a,'Path')||raw[1], d=argOf(a,'Destination')||raw[2];
    if(!s||!d) return [line('err','Copy-Item: 用法 Copy-Item <來源> <目的地>')];
    const sp=resolvePath(String(s).replace(/^["']|["']$/g,'')), sn=fsGet(sp);
    if(!sn) return [line('err','Copy-Item: Cannot find path \''+sp+'\' because it does not exist.')];
    const dp=resolvePath(String(d).replace(/^["']|["']$/g,'')), dn=fsGet(dp);
    const finalPath=(dn && dn.t==='d' && !samePath(dp,sp)) ? joinPath(fsCanon(dp)||dp, baseOf(sp)) : dp;
    if(samePath(sp,finalPath)) return [line('err','Copy-Item: The source and destination path must be different.')];
    if(sn.t==='d' && isDescendant(finalPath,sp))
      return [line('err','Copy-Item: Cannot copy a directory into itself or one of its descendants.')];
    const par=fsGet(dirOf(finalPath));
    if(!par||par.t!=='d') return [line('err','Copy-Item: Could not find part of the path \''+finalPath+'\'.')];
    setChild(par, baseOf(finalPath), fsClone(sn));   // Copy-Item 覆寫既有目的地(與真實 PowerShell 一致)
    return saved(null);}},
  'move-item':{params:['-Path','-Destination','-Force'],paths:true,help:'移動或改名 (mv)',run:function(a,raw){
    const s=argOf(a,'Path')||raw[1], d=argOf(a,'Destination')||raw[2];
    if(!s||!d) return [line('err','Move-Item: 用法 Move-Item <來源> <目的地>')];
    const sp=resolvePath(String(s).replace(/^["']|["']$/g,'')), sn=fsGet(sp);
    if(!sn) return [line('err','Move-Item: Cannot find path \''+sp+'\' because it does not exist.')];
    if(segsOf(sp).length<2) return [line('err','Move-Item: Access to the path \''+sp+'\' is denied.')];
    const dp=resolvePath(String(d).replace(/^["']|["']$/g,'')), dn=fsGet(dp);
    const finalPath=(dn && dn.t==='d' && !samePath(dp,sp)) ? joinPath(fsCanon(dp)||dp, baseOf(sp)) : dp;
    if(samePath(sp,finalPath)) return null;                    // 移到自己:PowerShell 視為成功且不動作
    if(sn.t==='d' && isDescendant(finalPath,sp))               // 移進自己的子孫會產生環,整棵子樹會消失
      return [line('err','Move-Item: Cannot move a directory into itself or one of its descendants.')];
    const par=fsGet(dirOf(finalPath));
    if(!par||par.t!=='d') return [line('err','Move-Item: Could not find part of the path \''+finalPath+'\'.')];
    if(fsGet(finalPath) && !argOf(a,'Force'))
      return [line('err','Move-Item: Cannot create a file when that file already exists.'),
              line('muted','加 -Force 可以覆寫。')];
    const sPar=fsParent(sp), sk=keyIn(sPar,baseOf(sp));
    if(sk) delete sPar.ch[sk];                                 // 先摘除來源,再放到目的地(避免大小寫改名時自我抵銷)
    setChild(par, baseOf(finalPath), sn);
    if(samePath(CWD,sp) || isDescendant(CWD,sp)){ CWD=HOME; updatePrompt(); }
    return saved(null);}},
  'rename-item':{params:['-Path','-NewName'],paths:true,help:'重新命名 (ren)',run:function(a,raw){
    const s=argOf(a,'Path')||raw[1], d=argOf(a,'NewName')||raw[2];
    if(!s||!d) return [line('err','Rename-Item: 用法 Rename-Item <路徑> <新名稱>')];
    const nn=String(d).replace(/^["']|["']$/g,'');
    if(/[\\/:]/.test(nn)) return [line('err','Rename-Item: -NewName 只能是名稱,不能是路徑。')];
    const sp=resolvePath(String(s).replace(/^["']|["']$/g,''));   // 新名稱相對「來源所在目錄」,不是目前目錄
    return CMDLETS['move-item'].run({Path:sp,Destination:joinPath(dirOf(sp),nn)},['move-item']);}},
  'select-string':{params:['-Pattern'],help:'搜尋檔案內容 (grep)',run:function(a,raw){
    const pat=String(argOf(a,'Pattern')||firstArg(raw)||'');
    if(!pat) return [line('err','Select-String: 需要 -Pattern。例: Select-String kubernetes')];
    if(pat.length>200) return [line('err','Select-String: -Pattern 過長(上限 200 字元)。')];
    let re; try{ re=new RegExp(pat,'i'); }catch(e){ return [line('err','Select-String: 無效的規則運算式。')]; }
    const hits=[];
    (function walk(n,path){ if(n.t==='d'){ Object.keys(n.ch).forEach(function(k){ walk(n.ch[k],path+'\\'+k); }); return; }
      fsText(n).forEach(function(r){ let t=r&&r.txt?r.txt:''; if(t && re.test(t))
        hits.push([baseOf(path), t.length>40?t.slice(0,40)+'...':t]); }); })(ROOT,'C:');
    if(!hits.length) return [line('muted','(無相符結果)')];
    return table(['File','Match'],hits.slice(0,14));},
    pipe:function(rows,a,raw){ let pat=String(argOf(a,'Pattern')||firstArg(raw)||'');
      let re; try{ re=new RegExp(pat,'i'); }catch(e){ return [line('err','Select-String: 無效的規則運算式。')]; }
      let o=rows.filter(function(r){ return r && r.txt && re.test(r.txt); });
      return o.length?o:[line('muted','(無相符結果)')];}},
  'tree':{params:[],help:'目錄樹',run:function(){
    let o=[line('',CWD)];
    (function walk(n,prefix){
      let ks=Object.keys(n.ch).sort(function(x,y){
        let dx=n.ch[x].t==='d'?0:1, dy=n.ch[y].t==='d'?0:1; return dx!==dy?dx-dy:(x.toLowerCase()<y.toLowerCase()?-1:1); });
      ks.forEach(function(k,i){
        let last=(i===ks.length-1), c=n.ch[k];
        o.push(line(c.t==='d'?'':'muted', prefix+(last?'\\---':'+---')+k));
        if(c.t==='d' && prefix.length<8) walk(c, prefix+(last?'    ':'|   '));
      });
    })(fsGet(CWD)||dnode(),'');
    return o;}},

  'where-object':{params:['-Match','-Like'],help:'篩選 (pipeline)',run:function(){return [line('muted','用法: <command> | Where-Object -Match kube')];},

      }
    }
    for(i=0;i<segs.length;i++) rows=execOne(segs[i],rows,i>0);
    if(rows && rows.length){ print(rows); print(line('','')); }
  }
  closeMenu(); setVal(''); scrollBottom();
}

/* ---------- 事件 ---------- */
function onKey(e){
  /* IME 組字中(注音/倉頡/日文/韓文):所有按鍵都交還給輸入法。
     Enter 是選字確認、↑↓ 與 Tab 是候選字操作,一律不可攔截。
     三重判斷:標準 isComposing、composition 事件旗標(舊 Safari/部分 Android IME 不可靠)、
     以及 IME 組字期間的哨兵 keyCode 229。 */
  if(e.isComposing || composing || e.keyCode===229) return;
  let k=e.key;
  if(menu.open){
    if(k==='Tab'||k==='ArrowDown'){ e.preventDefault(); menu.idx=(menu.idx+1)%menu.items.length; applyMenuPick(); renderMenu(); return; }
    if(k==='ArrowUp'){ e.preventDefault(); menu.idx=(menu.idx-1+menu.items.length)%menu.items.length; applyMenuPick(); renderMenu(); return; }
    if(k==='Enter'){ e.preventDefault(); closeMenu(); return; }            // 接受目前候選
    if(k==='Escape'){ e.preventDefault();                                   // 取消並還原開啟前的輸入
      const o=menu.orig, c=menu.origCaret; closeMenu();
      if(o!=null) setVal(o,c); return; }
    closeMenu();
  }
  if(k==='Enter'){ e.preventDefault(); if(busy) return; run(); return; }
  if(k==='Tab'){ if(!val()){ return; } e.preventDefault(); openOrCycle(); return; }
  if(k==='ArrowRight'||k==='End'){ if(atEnd()&&acceptPrediction()){ e.preventDefault(); } return; }
  if(k==='ArrowUp'){ e.preventDefault(); histNav(-1); return; }
  if(k==='ArrowDown'){ e.preventDefault(); histNav(1); return; }
  if((e.ctrlKey||e.metaKey)&&(k==='l'||k==='L')){ e.preventDefault(); clearOut(); scrollBottom(); return; }
  if((e.ctrlKey||e.metaKey)&&(k==='c'||k==='C')){ if(String(getSelection())) return; e.preventDefault(); printPrompt(val()); setVal(''); return; }
  if(k==='Escape'){ if(val()){ e.preventDefault(); setVal(''); } else { edit.blur(); } return; }
  /* 其餘按鍵交給原生 textarea 處理(手機軟鍵盤/貼上皆走 input 事件)*/
}
function focusEdit(){ try{ edit.focus({preventScroll:true}); }catch(e){ try{edit.focus();}catch(_){} } }
edit.addEventListener('keydown',onKey);
edit.addEventListener('compositionstart',function(){ composing=true; if(menu.open) closeMenu(); sync(); });
edit.addEventListener('compositionend',function(){ composing=false; sync(); });
edit.addEventListener('input',function(){ if(menu.open) closeMenu(); hIdx=null; sync(); });
edit.addEventListener('click',sync);
edit.addEventListener('keyup',function(e){ if(['ArrowLeft','ArrowRight','Home','End'].indexOf(e.key)>=0) sync(); });
edit.addEventListener('focus',function(){ con.classList.add('focused'); });
edit.addEventListener('blur',function(){ con.classList.remove('focused'); });
document.addEventListener('selectionchange',function(){ if(document.activeElement===edit) sync(); });
window.addEventListener('resize',function(){ charW=0; });   // 字元寬度快取作廢(轉向 / 字級改變)
con.addEventListener('click',function(e){
  if(!(e.target.closest && e.target.closest('.menu')) && !String(getSelection())) focusEdit(); });

/* ---------- 開場 ---------- */
function boot(){
  try{ document.documentElement.lang='zh-Hant'; }catch(e){}
  fsInit(); updatePrompt();
  try{ const t=localStorage.getItem('thc1006.theme'); if(t) setTheme(t); }catch(e){}   // 記住上次的主題
  print([
    {parts:[['banner','PowerShell 7.4  ·  '],['head','thc1006 edition']]},
    line(''),
    {parts:[['banner','Type '],['yellow','help'],['banner',' to explore, or try '],
            ['yellow','whoami'],['banner',' / '],['yellow','Get-Contribution -Foundation CNCF']]},
    {parts:[['banner','Themes: '],['yellow','Set-Theme pi'],['banner',' / windows / blue']]},
    line('')]);
  hist=['whoami','Get-Contribution -Foundation CNCF','Get-Publication -Full','Get-Award -Year 2023'];
  sync(); focusEdit();
}
boot();
