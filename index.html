function dw(s){var n=0,a=String(s);for(var i=0;i<a.length;i++){var c=a.codePointAt(i);

    line('muted','  sudo · coffee · rocket · matrix · fortune · konami · thc1006'),
    line('muted','  ping · sl · ifconfig · ipconfig · sudo apt install net-tools'),
    line('muted','  classic — 回到舊版 bash 終端機 (user@hctsai1006)'),
    line('muted','  (別名也算隱藏: cls ls dir h man whois profile gcm gci theme)')];},
};

var CORPUS=Object.keys(CMDLETS).map(toTitle).concat(Object.keys(ALIAS))
  .filter(function(v,i,a){return a.indexOf(v)===i;}).sort();
function PARAMS(n){return (CMDLETS[alias(String(n).toLowerCase())]||{params:[]}).params;}

/* ---------- 語法高亮(僅用於 echo)---------- */
function highlight(s){
  var toks=s.match(/(\s+|"[^"]*"?|'[^']*'?|--?[A-Za-z]\w*|\||>>|>|<|=|\$[\w:]+|[^\s|><=]+)/g)||[];
  var o='',first=true;
  toks.forEach(function(t){
    if(/^\s+$/.test(t)){o+=esc(t);return;}
    if(/^["']/.test(t)) o+='<span class="str">'+esc(t)+'</span>';
    else if(/^-/.test(t)) o+='<span class="param">'+esc(t)+'</span>';
    else if(/^([|><=]|>>)$/.test(t)) o+='<span class="op">'+esc(t)+'</span>';
    else if(/^\$/.test(t)) o+='<span class="var">'+esc(t)+'</span>';
    else if(/^\d+$/.test(t)) o+='<span class="num">'+esc(t)+'</span>';
    else if(first) o+='<span class="cmd">'+esc(t)+'</span>';
    else o+=esc(t);
    first=false;
  });
  return o;
}

/* ---------- 輸出(進 role=log)---------- */
function print(rows){ if(!rows)return; if(!Array.isArray(rows))rows=[rows];
  rows.forEach(function(r){ var d=document.createElement('div'); d.className='row';
    if(r.html!=null) d.innerHTML=r.html;
    else{ var c=r.cls||'',t=r.txt!=null?r.txt:''; d.innerHTML=c?'<span class="'+c+'">'+esc(t)+'</span>':esc(t); }
    out.appendChild(d); }); }
function promptHTML(){return '<span class="prompt">PS <span class="path">C:\\Users\\thc1006</span>&gt;&nbsp;</span>';}
function printPrompt(cmd){ var d=document.createElement('div'); d.className='row';
  d.innerHTML=promptHTML()+highlight(cmd); out.appendChild(d); }
function scrollBottom(){ con.scrollTop=con.scrollHeight; }
function asyncPrint(rows,gap,done){ var i=0; (function step(){ if(i<rows.length){ print(rows[i]); scrollBottom(); i++; setTimeout(step,gap); } else if(done) done(); })(); }

/* ---------- 狀態 ---------- */
var hist=[], hIdx=null, draft='';
var netToolsInstalled=false, ifconfigFail=0;   /* net-tools 彩蛋鏈狀態 */
var menu={open:false,items:[],idx:0,start:0};
function val(){return edit.value;}
function caretPos(){return edit.selectionStart||0;}
function atEnd(){return edit.selectionStart===edit.value.length && edit.selectionEnd===edit.value.length;}
function setVal(s,c){ edit.value=s; c=(c==null)?s.length:c; try{edit.setSelectionRange(c,c);}catch(e){} sync(); }

/* ---------- 預測 + ghost ---------- */
function predict(v){ if(!v)return''; var low=v.toLowerCase(),i,h;
  for(i=hist.length-1;i>=0;i--){ h=hist[i]; if(h.length>v.length && h.toLowerCase().indexOf(low)===0) return h; }
  for(i=0;i<CORPUS.length;i++){ if(CORPUS[i].length>v.length && CORPUS[i].toLowerCase().indexOf(low)===0) return CORPUS[i]; }
  return ''; }
function sync(){
  var v=val();
  mirror.textContent=v;
  edit.style.height='auto'; edit.style.height=edit.scrollHeight+'px';   // 長指令換行時自動長高,不裁切
  var p=(atEnd()&&!menu.open)?predict(v):'';
  ghost.textContent=p?p.slice(v.length):'';
  ghost.style.left=mirror.offsetWidth+'px';
  scrollBottom();
}

/* ---------- 補完選單 ---------- */
function currentToken(){ var v=val(),c=caretPos(); var sp=v.slice(0,c).lastIndexOf(' '); return {start:sp+1,word:v.slice(sp+1,c),c:c}; }
function replaceWord(start,pick,c){ var v=val(); setVal(v.slice(0,start)+pick+v.slice(c), start+pick.length); }
function renderMenu(){
  var old=document.querySelector('.menu'); if(old) old.remove();
  if(!menu.open) return;
  var m=document.createElement('div'); m.className='menu';
  menu.items.forEach(function(it,i){ var b=document.createElement('button'); b.type='button'; b.textContent=it;
    if(i===menu.idx)b.className='sel';
    b.addEventListener('click',function(){ menu.idx=i; applyMenuPick(); closeMenu(); focusEdit(); });
    m.appendChild(b); });
  document.querySelector('.editzone').appendChild(m);
}
function applyMenuPick(){ var tk=currentToken(); replaceWord(menu.start,menu.items[menu.idx],tk.c); }
function closeMenu(){ menu.open=false; renderMenu(); }
function openOrCycle(){
  if(menu.open){ menu.idx=(menu.idx+1)%menu.items.length; applyMenuPick(); renderMenu(); return; }
  var tk=currentToken();
  var cands=tk.start===0?CORPUS.slice():PARAMS(val().replace(/^\s+/,'').split(/\s+/)[0]).slice();
  cands=cands.filter(function(c){return c.toLowerCase().indexOf(tk.word.toLowerCase())===0;});
  if(!cands.length) return;
  if(cands.length===1){ replaceWord(tk.start,cands[0],tk.c); return; }
  menu={open:true,items:cands,idx:0,start:tk.start}; applyMenuPick(); renderMenu();
}
function acceptPrediction(){ var v=val(),p=predict(v); if(p&&atEnd()){ setVal(p,p.length); return true; } return false; }
function histNav(dir){ if(!hist.length)return;
  if(dir<0){ if(hIdx===null){draft=val();hIdx=hist.length-1;} else if(hIdx>0)hIdx--; }
  else{ if(hIdx===null)return; hIdx++; if(hIdx>hist.length-1){hIdx=null;setVal(draft);return;} }
  setVal(hist[hIdx]);
}
function run(){
  var raw=val(), cmd=raw.replace(/^\s+|\s+$/g,'');
  printPrompt(raw);
  if(cmd) hist.push(cmd);
  hIdx=null; draft='';
  if(cmd){
    var parts=cmd.match(/"[^"]*"|'[^']*'|\S+/g)||[];
    var key=parts[0].toLowerCase(), name=alias(key), c=CMDLETS[name];
    if(c){
      var args={};
      for(var i=1;i<parts.length;i++){ if(/^-/.test(parts[i])){
        args[parts[i].slice(1)]=(parts[i+1]&&!/^-/.test(parts[i+1]))?parts[++i].replace(/^["']|["']$/g,''):true; } }
      try{ print(c.run(args,parts)); }catch(e){ print(line('err','執行錯誤: '+e.message)); }
    } else if(EGGS[key]){
      try{ print(EGGS[key](parts)); }catch(e){ print(line('err',e.message)); }
    } else {
      var d=document.createElement('div'); d.className='row';
      d.innerHTML='<span class="err">'+esc(toTitle(parts[0]))+' : 無法辨識的指令。試試 </span>'+
        '<span class="cmd">help</span><span class="err"> 或 </span><span class="cmd">Get-Command</span><span class="err">。</span>';
      out.appendChild(d);
    }
  }
  closeMenu(); setVal(''); scrollBottom();
}

/* ---------- 事件 ---------- */
function onKey(e){
  var k=e.key;
  if(menu.open){
    if(k==='Tab'||k==='ArrowDown'){ e.preventDefault(); menu.idx=(menu.idx+1)%menu.items.length; applyMenuPick(); renderMenu(); return; }
    if(k==='ArrowUp'){ e.preventDefault(); menu.idx=(menu.idx-1+menu.items.length)%menu.items.length; applyMenuPick(); renderMenu(); return; }
    if(k==='Enter'||k==='Escape'){ e.preventDefault(); closeMenu(); return; }
    closeMenu();
  }
  if(k==='Enter'){ e.preventDefault(); run(); return; }
  if(k==='Tab'){ if(!val()){ return; } e.preventDefault(); openOrCycle(); return; }
  if(k==='ArrowRight'||k==='End'){ if(atEnd()&&acceptPrediction()){ e.preventDefault(); } return; }
  if(k==='ArrowUp'){ e.preventDefault(); histNav(-1); return; }
  if(k==='ArrowDown'){ e.preventDefault(); histNav(1); return; }
  if((e.ctrlKey||e.metaKey)&&(k==='l'||k==='L')){ e.preventDefault(); out.innerHTML=''; scrollBottom(); return; }
  if((e.ctrlKey||e.metaKey)&&(k==='c'||k==='C')){ if(String(getSelection())) return; e.preventDefault(); printPrompt(val()); setVal(''); return; }
  if(k==='Escape'){ if(val()){ e.preventDefault(); setVal(''); } else { edit.blur(); } return; }
  /* 其餘按鍵交給原生 textarea 處理(手機軟鍵盤/貼上皆走 input 事件)*/
}
function focusEdit(){ try{ edit.focus({preventScroll:true}); }catch(e){ try{edit.focus();}catch(_){} } }
edit.addEventListener('keydown',onKey);
edit.addEventListener('input',function(){ if(menu.open) closeMenu(); hIdx=null; sync(); });
edit.addEventListener('click',sync);
edit.addEventListener('keyup',function(e){ if(['ArrowLeft','ArrowRight','Home','End'].indexOf(e.key)>=0) sync(); });
edit.addEventListener('focus',function(){ con.classList.add('focused'); });
edit.addEventListener('blur',function(){ con.classList.remove('focused'); });
document.addEventListener('selectionchange',function(){ if(document.activeElement===edit) sync(); });
con.addEventListener('click',function(e){ if(e.target.tagName!=='BUTTON' && !String(getSelection())) focusEdit(); });

/* ---------- 開場 ---------- */
function boot(){
  try{ document.documentElement.lang='zh-Hant'; }catch(e){}
  function raw(html){ var d=document.createElement('div'); d.className='row'; d.innerHTML=html; out.appendChild(d); }
  raw('<span class="banner">PowerShell 7.4 &nbsp;·&nbsp; <b>thc1006 edition</b></span>');
  raw('&nbsp;');

  raw('<span class="banner">Themes: <span class="yellow">Set-Theme pi</span> / windows / blue</span>');
  raw('&nbsp;');
  hist=['whoami','Get-Contribution -Foundation CNCF','Get-Publication -Full','Get-Award -Year 2023'];
  sync(); focusEdit();
}
boot();
