function charWidth(){

function availCols(){ return Math.max(24, Math.floor((con.clientWidth-32)/charWidth())); }
/* 放不下就改用清單格式(等同 PowerShell 的 Format-List),欄位才不會因換行而錯位 */
function listFormat(headers,rows){
  const hw=Math.max.apply(null,headers.map(dw));
  const o=[];
  rows.forEach(function(r,idx){
    if(idx) o.push(line(''));
    headers.forEach(function(h,i){
      const label=padw(h,hw), value=String(r[i]);
      o.push({kv:[label,value], txt:label+' : '+value, indent:hw+3});   // 續行懸掛縮排到值的起點
    });
  });
  return o;
}
function table(headers,rows){
  let w=headers.map(function(h,i){return Math.max.apply(null,[dw(h)].concat(rows.map(function(r){return dw(String(r[i]));})));});
  const total=w.reduce(function(a,b){return a+b;},0)+2*(w.length-1);
  if(total>availCols() && rows.length<=12) return listFormat(headers,rows);
  let H=headers.map(function(h,i){return padw(h,w[i]);}).join('  ');
  let R=w.map(function(x){return new Array(x+1).join('-');}).join('  ');
  let o=[{cls:'head',txt:H},{cls:'rule',txt:R}];
  rows.forEach(function(r){o.push({cls:'',txt:r.map(function(c,i){return padw(c,w[i]);}).join('  ')});});
  return o;
}

function graftUser(stored,target){

  'get-childitem':{params:['-Path'],paths:true,help:'列出目錄內容 (dir/gci)',run:function(a,raw){
    const t=argOf(a,'Path')||firstArg(raw), p=t?resolvePath(t):CWD, n=fsGet(p);
    if(!n) return [line('err','Get-ChildItem: Cannot find path \''+p+'\' because it does not exist.')];
    const row=function(name,node){ return [modeStr(node),ownerOf(node),ownerOf(node),psTime(node.mt),String(fsSize(node)),name]; };
    if(n.t==='f') return table(['UnixMode','User','Group','LastWriteTime','Size','Name'],[row(baseOf(p),n)]);
    const ks=Object.keys(n.ch).sort(), rows=[];
    ks.filter(function(k){return n.ch[k].t==='d';}).forEach(function(k){ rows.push(row(k,n.ch[k])); });
    ks.filter(function(k){return n.ch[k].t==='f';}).forEach(function(k){ rows.push(row(k,n.ch[k])); });
    if(!rows.length) return [line('muted','(空目錄)')];
    const head=[line('muted','    Directory: '+fsCanon(p)),line('')];
    /* 窄螢幕收成三欄:六欄會撐爆手機,而 table() 的清單退化在檔案列表上完全不可讀 */
    if(availCols()<100) return head.concat(table(['UnixMode','Size','Name'],
      rows.map(function(r){return [r[0],r[4],r[5]];})));
    return head.concat(table(['UnixMode','User','Group','LastWriteTime','Size','Name'],rows));}},

  'set-content':{params:['-Path','-Value'],paths:true,help:'寫入檔案內容 (sc)',run:function(a,raw){
    let t=argOf(a,'Path')||firstArg(raw);
    if(!t) return [line('err','Set-Content: 缺少 -Path。例: Set-Content notes.txt "hello"')];
    let v=argOf(a,'Value');
    if(v===undefined||v===true){ const i=raw.indexOf(t); v=raw.slice(i+1).filter(function(x){return !FLAGRE.test(x);}).join(' '); }
    v=String(v).replace(/^["']|["']$/g,'');
    const p=resolvePath(t), par=fsParent(p);
    if(!par||par.t!=='d') return [line('err','Set-Content: Could not find part of the path \''+p+'\'.')];
    const ex=keyIn(par,baseOf(p));
    if(ex && par.ch[ex].t==='d') return [line('err','Set-Content: \''+p+'\' is a directory.')];
    /* 覆寫看檔案本身的擁有者,新建看父目錄的 —— /etc/hostname 這種 root 檔案兩條都擋得住 */
    if(ex ? ownerOf(par.ch[ex])!==USERNAME : !writable(par))
      return [line('err','Set-Content: Access to the path \''+p+'\' is denied.')];
    setChild(par, ex||baseOf(p), stamp(fnode(null,false,v?[v]:[])));
    return saved(null);}},
  'add-content':{params:['-Path','-Value'],paths:true,help:'附加檔案內容 (ac)',run:function(a,raw){

  'new-item':{params:['-Path','-ItemType','-Force'],paths:true,help:'建立檔案或資料夾 (mkdir/ni)',run:function(a,raw){
    let t=argOf(a,'Path')||firstArg(raw);
    let head=String(raw[0]).toLowerCase();
    if(!t) return [line('err','New-Item: 缺少 -Path。例: New-Item demo -ItemType Directory')];
    let it=String(argOf(a,'ItemType')||'').toLowerCase();
    let wantDir = it.indexOf('dir')===0 || head==='mkdir' || head==='md';
    let p=resolvePath(t);
    if(fsGet(p)) return [line('err','New-Item: An item with the specified name \''+p+'\' already exists.')];
    let segs=segsOf(p);
    if(!segs.length) return [line('err','New-Item: 無效的路徑。')];
    const parentPath='/'+segs.slice(0,-1).join('/'); let par=fsGet(parentPath);
    if(!par){ if(!wantDir && !argOf(a,'Force')) return [line('err','New-Item: Could not find part of the path \''+p+'\'.')];
      par=fsMkdirp(parentPath); }
    if(!par||par.t!=='d') return [line('err','New-Item: Could not find part of the path \''+p+'\'.')];
    if(!writable(par)) return [line('err','New-Item: Access to the path \''+p+'\' is denied.')];
    let name=segs[segs.length-1];
    const nn=stamp(wantDir?dnode():fnode(null,false,[]));
    setChild(par,name,nn);
    /* Unix 上的 New-Item 走的是 FileSystem provider 在 Unix 的格式,不是 Windows 的 d----/-a--- */
    return saved([line('muted','    Directory: '+(fsCanon(parentPath)||'/')),line('')]
      .concat(table(['UnixMode','User','Group','LastWriteTime','Size','Name'],
        [[modeStr(nn),ownerOf(nn),ownerOf(nn),psTime(nn.mt),String(fsSize(nn)),name]])));}},
  'remove-item':{params:['-Path','-Recurse','-Force'],paths:true,help:'刪除檔案或資料夾 (rm/del)',run:function(a,raw){
    let t=argOf(a,'Path')||firstArg(raw);
    if(!t) return [line('err','Remove-Item: 缺少 -Path。')];
    let p=resolvePath(t), n=fsGet(p);
    if(!n) return [line('err','Remove-Item: Cannot find path \''+p+'\' because it does not exist.')];
    /* 刪除是改父目錄,所以看的是父目錄的擁有權 —— 連 ~ 本身都刪不掉,因為 /home 屬 root */
    if(!writable(fsParent(p))) return [line('err','Remove-Item: Access to the path \''+p+'\' is denied.')];
    if(n.t==='d' && Object.keys(n.ch).length && !(argOf(a,'Recurse')||argOf(a,'Force')))
      return [line('err','Remove-Item: The directory \''+baseOf(p)+'\' is not empty.'),
              line('muted','加 -Recurse 可以連同內容一起刪除。')];
    let par=fsParent(p), k=keyIn(par,baseOf(p));
    if(k) rmChild(par,k);
    if(samePath(CWD,p) || isDescendant(CWD,p)){ CWD=HOME; updatePrompt(); }   // 刪到自己所在的目錄就退回 HOME
    return saved(null);}},
  /* 目的地是既有資料夾時,真正的落點是「資料夾 + 來源名稱」;所有檢查都要針對這個落點。 */
  'copy-item':{params:['-Path','-Destination','-Recurse'],paths:true,help:'複製項目 (cp)',run:function(a,raw){
    const s=argOf(a,'Path')||raw[1], d=argOf(a,'Destination')||raw[2];
    if(!s||!d) return [line('err','Copy-Item: 用法 Copy-Item <來源> <目的地>')];
    const sp=resolvePath(String(s).replace(/^["']|["']$/g,'')), sn=fsGet(sp);
    if(!sn) return [line('err','Copy-Item: Cannot find path \''+sp+'\' because it does not exist.')];
    const dp=resolvePath(String(d).replace(/^["']|["']$/g,'')), dn=fsGet(dp);
    const finalPath=(dn && dn.t==='d' && !samePath(dp,sp)) ? joinPath(fsCanon(dp)||dp, baseOf(sp)) : dp;
    if(samePath(sp,finalPath)) return [line('err','Copy-Item: The source and destination path must be different.')];
    if(sn.t==='d' && isDescendant(finalPath,sp))
      return [line('err','Copy-Item: Cannot copy a directory into itself or one of its descendants.')];
    const par=fsGet(dirOf(finalPath));
    if(!par||par.t!=='d') return [line('err','Copy-Item: Could not find part of the path \''+finalPath+'\'.')];
    if(!writable(par)) return [line('err','Copy-Item: Access to the path \''+finalPath+'\' is denied.')];
    const cc=stamp(fsClone(sn)); cc.own=null;         // 複製出來的東西屬於執行的人,不是原擁有者
    setChild(par, baseOf(finalPath), cc);             // Copy-Item 覆寫既有目的地(與真實 PowerShell 一致)
    return saved(null);}},
  'move-item':{params:['-Path','-Destination','-Force'],paths:true,help:'移動或改名 (mv)',run:function(a,raw){
    const s=argOf(a,'Path')||raw[1], d=argOf(a,'Destination')||raw[2];
    if(!s||!d) return [line('err','Move-Item: 用法 Move-Item <來源> <目的地>')];
    const sp=resolvePath(String(s).replace(/^["']|["']$/g,'')), sn=fsGet(sp);
    if(!sn) return [line('err','Move-Item: Cannot find path \''+sp+'\' because it does not exist.')];
    if(!writable(fsParent(sp))) return [line('err','Move-Item: Access to the path \''+sp+'\' is denied.')];
    const dp=resolvePath(String(d).replace(/^["']|["']$/g,'')), dn=fsGet(dp);
    const finalPath=(dn && dn.t==='d' && !samePath(dp,sp)) ? joinPath(fsCanon(dp)||dp, baseOf(sp)) : dp;
    if(samePath(sp,finalPath)) return null;                    // 移到自己:PowerShell 視為成功且不動作
    if(sn.t==='d' && isDescendant(finalPath,sp))               // 移進自己的子孫會產生環,整棵子樹會消失
      return [line('err','Move-Item: Cannot move a directory into itself or one of its descendants.')];
    const par=fsGet(dirOf(finalPath));
    if(!par||par.t!=='d') return [line('err','Move-Item: Could not find part of the path \''+finalPath+'\'.')];
    if(!writable(par)) return [line('err','Move-Item: Access to the path \''+finalPath+'\' is denied.')];
    if(fsGet(finalPath) && !argOf(a,'Force'))
      return [line('err','Move-Item: Cannot create a file when that file already exists.'),
              line('muted','加 -Force 可以覆寫。')];
    const sPar=fsParent(sp), sk=keyIn(sPar,baseOf(sp));
    if(sk) rmChild(sPar,sk);                                   // 先摘除來源,再放到目的地(避免大小寫改名時自我抵銷)
    stamp(sn); setChild(par, baseOf(finalPath), sn);
    if(samePath(CWD,sp) || isDescendant(CWD,sp)){ CWD=HOME; updatePrompt(); }
    return saved(null);}},
  'rename-item':{params:['-Path','-NewName'],paths:true,help:'重新命名 (ren)',run:function(a,raw){
    const s=argOf(a,'Path')||raw[1], d=argOf(a,'NewName')||raw[2];

  'select-string':{params:['-Pattern'],help:'搜尋檔案內容 (grep)',run:function(a,raw){
    const pat=String(argOf(a,'Pattern')||firstArg(raw)||'');
    if(!pat) return [line('err','Select-String: 需要 -Pattern。例: Select-String kubernetes')];

    let re; try{ re=new RegExp(pat,'i'); }catch(e){ return [line('err','Select-String: 無效的規則運算式。')]; }
    const hits=[];
    (function walk(n,path){ if(n.t==='d'){ Object.keys(n.ch).forEach(function(k){ walk(n.ch[k],path+'\\'+k); }); return; }
      fsText(n).forEach(function(r){ let t=r&&r.txt?r.txt:''; if(t && re.test(t))
        hits.push([baseOf(path), t.length>40?t.slice(0,40)+'...':t]); }); })(ROOT,'');
    if(!hits.length) return [line('muted','(無相符結果)')];
    return table(['File','Match'],hits.slice(0,14));},
    pipe:function(rows,a,raw){ let pat=String(argOf(a,'Pattern')||firstArg(raw)||'');
      let re; try{ re=new RegExp(pat,'i'); }catch(e){ return [line('err','Select-String: 無效的規則運算式。')]; }
      let o=rows.filter(function(r){ return r && r.txt && re.test(r.txt); });
      return o.length?o:[line('muted','(無相符結果)')];}},
  'tree':{params:[],help:'目錄樹',run:function(){
    let o=[line('',CWD)];
    (function walk(n,prefix){
      let ks=Object.keys(n.ch).sort(function(x,y){
        let dx=n.ch[x].t==='d'?0:1, dy=n.ch[y].t==='d'?0:1; return dx!==dy?dx-dy:(x.toLowerCase()<y.toLowerCase()?-1:1); });
      ks.forEach(function(k,i){

        o.push(line(c.t==='d'?'':'muted', prefix+(last?'\\---':'+---')+k));
        if(c.t==='d' && prefix.length<8) walk(c, prefix+(last?'    ':'|   '));
      });
    })(fsGet(CWD)||dnode(),'');
    return o;}},

  'ps':{type:'Application',params:[],help:'程序列表 (procps)',run:function(a,raw){

  'ls':{type:'Application',params:[],paths:true,help:'列出目錄內容 (coreutils)',run:function(a,raw){
    let long=false,all=false,human=false,one=false,target='';
    for(let i=1;i<raw.length;i++){
      const t=String(raw[i]).replace(/^["']|["']$/g,'');
      if(/^--/.test(t)){ if(t==='--all')all=true; else if(t==='--human-readable')human=true; continue; }
      if(t.charAt(0)==='-'&&t.length>1){
        for(let j=1;j<t.length;j++){ const c=t.charAt(j);
          if(c==='l')long=true; else if(c==='a'||c==='A')all=true;
          else if(c==='h')human=true; else if(c==='1')one=true; }
        continue; }

    const p=target?resolvePath(target):CWD, n=fsGet(p);
    if(!n) return [line('err',"ls: cannot access '"+(target||p)+"': No such file or directory")];
    const humanSize=function(node){ const s=fsSize(node);
      if(!human) return String(s);
      if(s>=1048576) return (s/1048576).toFixed(1)+'M';
      if(s>=1024) return (s/1024).toFixed(1)+'K';

    if(n.t==='f'){                       /* ls -l <file> 要給該檔的長格式,不是只印檔名 */
      if(!long) return [line('',baseOf(p))];
      return [line('', modeStr(n)+' 1 '+ownerOf(n)+' '+ownerOf(n)+' '
        +humanSize(n)+' '+lsTime(n.mt)+' '+baseOf(p))]; }
    let names=Object.keys(n.ch).sort();
    if(!all) names=names.filter(function(k){return k.charAt(0)!=='.';});
    else names=['.','..'].concat(names);
    if(!names.length) return [];
    const nodeOf=function(name){ return name==='.'?n:(name==='..'?(fsParent(p)||n):n.ch[name]); };
    const nlink=function(node){ return node.t!=='d'?1:
      2+Object.keys(node.ch).filter(function(k){return node.ch[k].t==='d';}).length; };
    if(!long) return one?names.map(function(x){return line('',x);}):[line('',names.join('  '))];
    const rows=names.map(function(name){ const node=nodeOf(name);
      return [modeStr(node),String(nlink(node)),ownerOf(node),ownerOf(node),humanSize(node),lsTime(node.mt),name]; });
    const wN=Math.max.apply(null,rows.map(function(r){return r[1].length;}));
    const wU=Math.max.apply(null,rows.map(function(r){return dw(r[2]);}));
    const wG=Math.max.apply(null,rows.map(function(r){return dw(r[3]);}));
    const wS=Math.max.apply(null,rows.map(function(r){return r[4].length;}));
    const blocks=names.reduce(function(acc,name){ return acc+Math.ceil(fsSize(nodeOf(name))/1024); },0);

  'rm':{type:'Application',params:[],paths:true,help:'刪除檔案或目錄 (coreutils)',run:function(a,raw){

  'cp':{type:'Application',params:[],paths:true,help:'複製檔案 (coreutils)',run:function(a,raw){

  'mv':{type:'Application',params:[],paths:true,help:'移動或改名 (coreutils)',run:function(a,raw){

  'chmod':{type:'Application',params:[],paths:true,help:'變更檔案權限 (coreutils)',run:function(a,raw){

/* iputils ping 的輸出格式(Linux) */
function pingRun(a,raw){
  const t=String(argOf(a,'TargetName')||firstArg(raw)||'localhost');
  const seq=[line('','PING '+t+' (10.6.10.6) 56(84) bytes of data.')], ms=[];
  for(let i=0;i<4;i++){ const v=(Math.random()*8+3); ms.push(v);
    seq.push(line('','64 bytes from 10.6.10.6: icmp_seq='+(i+1)+' ttl=64 time='+v.toFixed(1)+' ms')); }
  const mn=Math.min.apply(null,ms), mx=Math.max.apply(null,ms);
  const avg=ms.reduce(function(s,v){return s+v;},0)/ms.length;                     /* 平均,不是中程值 */
  const mdev=Math.sqrt(ms.reduce(function(s,v){return s+(v-avg)*(v-avg);},0)/ms.length);
  seq.push(line(''),line('','--- '+t+' ping statistics ---'),
    line('','4 packets transmitted, 4 received, 0% packet loss, time 3005ms'),
    line('','rtt min/avg/max/mdev = '+mn.toFixed(3)+'/'+avg.toFixed(3)+'/'+mx.toFixed(3)+'/'+mdev.toFixed(3)+' ms'));
  asyncPrint(seq,180); return null;
}

/* 語法高亮改為直接建立 DOM 節點(textContent),
   使用者輸入完全不經過 HTML parser —— 沒有 innerHTML sink 可言。 */
function tokClass(t,first){
  if(/^\s+$/.test(t)) return null;
  if(/^["']/.test(t)) return 'str';
  if(/^-/.test(t)) return 'param';
  if(/^([|><=]|>>)$/.test(t)) return 'op';
  if(/^\$/.test(t)) return 'var';
  if(/^\d+$/.test(t)) return 'num';
  return first?'cmd':null;
}
function highlightInto(parent,s){
  const toks=String(s).match(/(\s+|"[^"]*"?|'[^']*'?|--?[A-Za-z]\w*|\||>>|>|<|=|\$[\w:]+|[^\s|><=]+)/g)||[];
  let first=true;
  for(let i=0;i<toks.length;i++){
    const t=toks[i], cls=tokClass(t,first);
    if(cls){ const sp=document.createElement('span'); sp.className=cls; sp.textContent=t; parent.appendChild(sp); }
    else parent.appendChild(document.createTextNode(t));
    if(!/^\s+$/.test(t)) first=false;
  }
  return parent;
}

/* 所有輸出都必須經過這裡才會受上限保護 */
function trimOutput(){ while(out.childElementCount>MAXROWS) out.removeChild(out.firstChild); }
/* 批次插入:整批 rows 在記憶體組裝,只觸發一次 reflow。
   整份檔案沒有任何 innerHTML —— 全部以 textContent / DOM 節點建立,不存在 injection sink。
   row 的形態:{cls,txt} 純文字 · {code} 語法高亮 · {kv} 清單欄位 · {parts} 多段樣式(可含連結)。 */
function print(rows){ if(!rows) return; if(!Array.isArray(rows)) rows=[rows];
  const frag=document.createDocumentFragment();
  for(let i=0;i<rows.length;i++){ const r=rows[i]; if(!r) continue;
    const d=document.createElement('div'); d.className='row';
    if(r.kv){ const s=document.createElement('span'); s.className='head'; s.textContent=r.kv[0];
      d.appendChild(s); d.appendChild(document.createTextNode(' : '+r.kv[1]));
      if(r.indent){ d.style.paddingLeft=r.indent+'ch'; d.style.textIndent=(-r.indent)+'ch'; } }
    else if(r.code!=null){ highlightInto(d,r.code); }
    else if(r.parts){ r.parts.forEach(function(p){
        if(p[0]==='a'){ const a=document.createElement('a'); a.setAttribute('href',p[2]);
          a.setAttribute('target','_blank'); a.setAttribute('rel','noopener');
          a.className='cmd'; a.style.textDecoration='underline'; a.textContent=p[1]; d.appendChild(a); }
        else if(p[0]){ const s=document.createElement('span'); s.className=p[0]; s.textContent=p[1]; d.appendChild(s); }
        else d.appendChild(document.createTextNode(p[1])); }); }
    else if(r.cls){ const s=document.createElement('span'); s.className=r.cls;
      s.textContent=(r.txt!=null?r.txt:''); d.appendChild(s); }
    else { d.textContent=(r.txt!=null?r.txt:''); }
    frag.appendChild(d); }
  out.appendChild(frag);
  trimOutput(); }

  if(menu.open){ menu.idx=(menu.idx+1)%menu.items.length; applyMenuPick(); renderMenu(); return; }
  let tk=currentToken(), v=val(), before=v.slice(0,tk.start), cands;
  if(/^\s*$/.test(before) || /\|\s*$/.test(before)) cands=CORPUS.slice();
  else{
    let head=(before.split('|').pop()||'').replace(/^\s+/,'').split(/\s+/)[0]||'';
    let c=CMDLETS[alias(head.toLowerCase())];
    cands=(c&&c.params)?c.params.slice():[];
    if(c&&c.paths) cands=cands.concat(pathCandidates());
    if(!cands.length) cands=CORPUS.slice();
  }
  cands=cands.filter(function(x){return String(x).toLowerCase().indexOf(tk.word.toLowerCase())===0;});
  if(!cands.length) return;
  if(cands.length===1){ replaceWord(tk.start,cands[0],tk.c); return; }
  menu={open:true,items:cands,idx:0,start:tk.start,orig:val(),origCaret:tk.c};
  applyMenuPick(); renderMenu();
}
function acceptPrediction(){ let v=val(),p=predict(v); if(p&&atEnd()){ setVal(p,p.length); return true; } return false; }
function histNav(dir){ if(!hist.length)return;
  if(dir<0){ if(hIdx===null){draft=val();hIdx=hist.length-1;} else if(hIdx>0)hIdx--; }
  else{ if(hIdx===null)return; hIdx++; if(hIdx>hist.length-1){hIdx=null;setVal(draft);return;} }
  setVal(hist[hIdx]);
}
function splitPipe(cmd){ let o=[],cur='',q=null,i,ch;
  for(i=0;i<cmd.length;i++){ ch=cmd.charAt(i);
    if(q){ cur+=ch; if(ch===q) q=null; continue; }
    if(ch==='"'||ch==="'"){ q=ch; cur+=ch; continue; }
    if(ch==='|'){ o.push(cur); cur=''; continue; }
    cur+=ch; }
  o.push(cur);
  return o.map(function(s){return s.replace(/^\s+|\s+$/g,'');}).filter(function(s){return s.length;}); }
function parseArgsOf(parts){ const args=Object.create(null); let i,pk;
  for(i=1;i<parts.length;i++){ if(FLAGRE.test(parts[i])){
    pk=parts[i].replace(/^-+/,'');
    args[pk]=(parts[i+1]&&!FLAGRE.test(parts[i+1]))?String(parts[++i]).replace(/^["']|["']$/g,''):true; } }
  return args; }
/* 打錯的參數名不能被當成位置參數吞掉 —— Get-Award -Yera 2026 必須報錯,而不是默默篩 2026 */
function unknownParam(c,args){
  if(!c.params||!c.params.length) return null;
  const allowed=c.params.map(function(p){return String(p).replace(/^-+/,'').toLowerCase();});
  const keys=Object.keys(args);
  for(let i=0;i<keys.length;i++){ if(allowed.indexOf(keys[i].toLowerCase())<0) return keys[i]; }
  return null;
}
function execOne(seg,input,piped){
  let parts=seg.match(/"[^"]*"|'[^']*'|\S+/g)||[];
  if(!parts.length) return input;
  let key=parts[0].toLowerCase(), c=CMDLETS[alias(key)], args=parseArgsOf(parts);
  if(c){
    const bad=unknownParam(c,args);
    if(bad) return [line('err',(c.disp||key)+': A parameter cannot be found that matches parameter name \''+bad+'\'.')];
    try{ return (piped&&c.pipe)?c.pipe(input||[],args,parts):c.run(args,parts,input); }
    catch(e){ return [line('err',(c.disp||key)+': '+e.message)]; } }
  if(EGGS[key]){ try{ return EGGS[key](parts); }catch(e){ return [line('err',e.message)]; } }
  return [line('err',`${parts[0]}: The term '${parts[0]}' is not recognized as a name of a cmdlet, function, script file, or executable program.`),
    line('err','Check the spelling of the name, or if a path was included, verify that the path is correct and try again.'),
    line('muted','試 help 或 Get-Command 看可用指令。')];
}
function run(){
  let raw=val(), cmd=raw.replace(/^\s+|\s+$/g,'');
  printPrompt(raw);
  if(cmd) hist.push(cmd);
  if(hist.length>MAXHIST) hist=hist.slice(-MAXHIST);
  hIdx=null; draft='';
  if(cmd){
    const segs=splitPipe(cmd);
    let rows=null, i;
    /* 逐行串流輸出的指令(ping/traceroute)是即時副作用,放進同步管線會讓下一段先拿到空集合。
       與其假裝支援,不如明確拒絕。 */
    for(i=0;i<segs.length && segs.length>1;i++){
      const k=String((segs[i].match(/\S+/)||[''])[0]).toLowerCase(), cc=CMDLETS[alias(k)];
      if(cc && cc.asyncOut){
        print([line('err',(cc.disp||k)+': 這個指令是逐行串流輸出,不能用在管線中。')]);
        print(line('','')); closeMenu(); setVal(''); scrollBottom(); return;
      }
    }
    for(i=0;i<segs.length;i++) rows=execOne(segs[i],rows,i>0);
    if(rows && rows.length){ print(rows); print(line('','')); }
  }
  closeMenu(); setVal(''); scrollBottom();
}

/* ---------- 事件 ---------- */
function onKey(e){
  /* IME 組字中(注音/倉頡/日文/韓文):所有按鍵都交還給輸入法。
     Enter 是選字確認、↑↓ 與 Tab 是候選字操作,一律不可攔截。
     三重判斷:標準 isComposing、composition 事件旗標(舊 Safari/部分 Android IME 不可靠)、
     以及 IME 組字期間的哨兵 keyCode 229。 */
  if(e.isComposing || composing || e.keyCode===229) return;
  let k=e.key;
  if(menu.open){
    if(k==='Tab'||k==='ArrowDown'){ e.preventDefault(); menu.idx=(menu.idx+1)%menu.items.length; applyMenuPick(); renderMenu(); return; }
    if(k==='ArrowUp'){ e.preventDefault(); menu.idx=(menu.idx-1+menu.items.length)%menu.items.length; applyMenuPick(); renderMenu(); return; }
    if(k==='Enter'){ e.preventDefault(); closeMenu(); return; }            // 接受目前候選
    if(k==='Escape'){ e.preventDefault();                                   // 取消並還原開啟前的輸入
      const o=menu.orig, c=menu.origCaret; closeMenu();
      if(o!=null) setVal(o,c); return; }
    closeMenu();
  }
  if(k==='Enter'){ e.preventDefault(); if(busy) return; run(); return; }
  if(k==='Tab'){ if(!val()){ return; } e.preventDefault(); openOrCycle(); return; }
  if(k==='ArrowRight'||k==='End'){ if(atEnd()&&acceptPrediction()){ e.preventDefault(); } return; }
  if(k==='ArrowUp'){ e.preventDefault(); histNav(-1); return; }
  if(k==='ArrowDown'){ e.preventDefault(); histNav(1); return; }
  if((e.ctrlKey||e.metaKey)&&(k==='l'||k==='L')){ e.preventDefault(); clearOut(); scrollBottom(); return; }
  if((e.ctrlKey||e.metaKey)&&(k==='c'||k==='C')){ if(String(getSelection())) return; e.preventDefault(); printPrompt(val()); setVal(''); return; }
  if(k==='Escape'){ if(val()){ e.preventDefault(); setVal(''); } else { edit.blur(); } return; }
  /* 其餘按鍵交給原生 textarea 處理(手機軟鍵盤/貼上皆走 input 事件)*/
}
function focusEdit(){ try{ edit.focus({preventScroll:true}); }catch(e){ try{edit.focus();}catch(_){} } }
edit.addEventListener('keydown',onKey);
edit.addEventListener('compositionstart',function(){ composing=true; if(menu.open) closeMenu(); sync(); });
edit.addEventListener('compositionend',function(){ composing=false; sync(); });
edit.addEventListener('input',function(){ if(menu.open) closeMenu(); hIdx=null; sync(); });
edit.addEventListener('click',sync);
edit.addEventListener('keyup',function(e){ if(['ArrowLeft','ArrowRight','Home','End'].indexOf(e.key)>=0) sync(); });
edit.addEventListener('focus',function(){ con.classList.add('focused'); });
edit.addEventListener('blur',function(){ con.classList.remove('focused'); });
document.addEventListener('selectionchange',function(){ if(document.activeElement===edit) sync(); });
window.addEventListener('resize',function(){ charW=0; });   // 字元寬度快取作廢(轉向 / 字級改變)
con.addEventListener('click',function(e){
  if(!(e.target.closest && e.target.closest('.menu')) && !String(getSelection())) focusEdit(); });

/* ---------- 開場 ---------- */
function boot(){
  try{ document.documentElement.lang='zh-Hant'; }catch(e){}
  fsInit(); updatePrompt();
  try{ const t=localStorage.getItem('thc1006.theme'); if(t) setTheme(t); }catch(e){}   // 記住上次的主題
  print([
    {parts:[['banner','PowerShell 7.4  ·  '],['head','thc1006 edition']]},
    line(''),
    {parts:[['banner','Type '],['yellow','help'],['banner',' to explore, or try '],
            ['yellow','whoami'],['banner',' / '],['yellow','Get-Contribution -Foundation CNCF']]},
    {parts:[['banner','Themes: '],['yellow','Set-Theme pi'],['banner',' / campbell / blue']]},
    line('')]);
  hist=['whoami','Get-Contribution -Foundation CNCF','Get-Publication -Full','Get-Award -Year 2023'];
  sync(); focusEdit();
}
boot();
</script>
