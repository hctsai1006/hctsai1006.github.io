  let H=headers.map(function(h,i){return padw(h,w[i]);}).join('  ');

   而 saved() 又回報成功 —— 正是本專案修過一次的「靜默失效」類別。 */
function fsSer(n){ let o;
  /* ch 必須是 null 原型:否則檔名 __proto__ 會觸發 setter 改寫原型,
     序列化成 JSON 時整個 key 消失 —— 重整後那個檔案靜默不見。 */
  if(n.t==='d'){ o={t:'d',ch:Object.create(null)}; Object.keys(n.ch).forEach(function(k){ o.ch[k]=fsSer(n.ch[k]); }); }
  else o=n.seed?{t:'f',s:1}:{t:'f',x:n.text||[]};
  if(n.mode!==DEFMODE[n.t]) o.m=n.mode;
  if(n.mt!==SEEDTIME) o.mt=n.mt;
  return o; }
function isSerNode(v){ if(!v||typeof v!=='object') return false;
  if(v.t==='f') return v.s===1 || Array.isArray(v.x);
  if(v.t==='d') return !!v.ch && typeof v.ch==='object' && !Array.isArray(v.ch);
  return false; }
/* localStorage 是使用者可以直接編輯的,反序列化時中繼資料一律驗過才採用 */
function applyMeta(n,o){
  if(typeof o.m==='string' && /^[rwxsStT-]{9}$/.test(o.m)) n.mode=o.m;
  if(typeof o.mt==='number' && isFinite(o.mt) && o.mt>0) n.mt=o.mt;
  return n; }
function fsDeser(o,path){ if(o.t==='d'){ const n=dnode();
    Object.keys(o.ch).forEach(function(k){ if(isSerNode(o.ch[k])) n.ch[k]=fsDeser(o.ch[k],path+'/'+k); });
    return applyMeta(n,o); }
  if(o.s) return applyMeta(fnode(SEEDROWS[path]||[line('muted','(seed content unavailable)')],true),o);
  return applyMeta(fnode(null,false,o.x||[]),o); }
/* 儲存失敗(配額用盡、隱私模式)不能悄悄吞掉 —— 使用者會以為存好了,重整後才發現不見。 */
function fsSave(){
  try{ localStorage.setItem(FSKEY,JSON.stringify(fsSer(ROOT))); return null; }
  catch(e){ return line('err','Warning: changes are in memory only; browser storage is unavailable ('+((e&&e.name)||'StorageError')+'). They will be lost on reload.'); }
}
function saved(rows){ const w=fsSave(); if(!w) return rows; return (rows||[]).concat([w]); }
/* 真正的 overlay:種子樹每次開機都重建成「這一版」的內容,localStorage 只回填
   使用者自己建立或改過的節點。否則作品集更新後,曾經造訪過的人會永遠停在舊樹,
   看不到新增的檔案(例如 in-review.md)。
   取捨:使用者刪掉種子檔後重新載入會復原 —— 作品集內容以站上這一版為準,
   使用者自己建立的檔案則完整保留。要全部歸零請用 Reset-FileSystem。 */
function graftUser(stored,target){
  if(!stored||stored.t!=='d'||!target||target.t!=='d') return;
  Object.keys(stored.ch).forEach(function(k){
    const s=stored.ch[k], ek=keyIn(target,k);
    if(s.t==='f'){
      if(!s.seed){ target.ch[ek||k]=s; return; }               // 使用者建立或改寫過的檔案
      const tf=ek?target.ch[ek]:null;                          // 種子檔只回填 chmod/touch 過的中繼資料
      if(tf&&tf.t==='f'){ tf.mode=s.mode; tf.mt=s.mt; }
      return; }
    if(!ek) target.ch[k]=dnode();                              // 使用者建立的資料夾
    const td=target.ch[ek||k];
    if(!td||td.t!=='d') return;                                // 種子把同名項目改成檔案了,以種子為準
    td.mode=s.mode; td.mt=s.mt;
    graftUser(s, td);
  });
}
function fsLoad(){ try{ const s=localStorage.getItem(FSKEY); if(!s) return false;
  const o=JSON.parse(s); if(!o||o.t!=='d') return false;
  graftUser(fsDeser(o,''), ROOT); return true; }catch(e){ return false; } }
function fsReset(){ buildSeed(); try{ localStorage.removeItem(FSKEY); }catch(e){} CWD=HOME; updatePrompt(); }
function fsInit(){ buildSeed(); fsLoad(); if(!fsGet(HOME)) buildSeed(); }

  'new-item':{params:['-Path','-ItemType','-Force'],paths:true,help:'Create a new file or directory (mkdir/ni)',run:function(a,raw){

  'remove-item':{params:['-Path','-Recurse','-Force'],paths:true,help:'Delete a file or directory (rm/del)',run:function(a,raw){

  /* 目的地是既有資料夾時,真正的落點是「資料夾 + 來源名稱」;所有檢查都要針對這個落點。 */

  'move-item':{params:['-Path','-Destination','-Force'],paths:true,help:'Move an item to another location (mv)',run:function(a,raw){

  'rename-item':{params:['-Path','-NewName'],paths:true,help:'Rename an item (ren)',run:function(a,raw){

  /* ===== 原生 Unix 指令 =====

  'ls':{type:'Application',params:[],paths:true,help:'list directory contents',run:function(a,raw){

  'chmod':{type:'Application',params:[],paths:true,help:'change file mode bits',run:function(a,raw){

/* iputils ping 的輸出格式(Linux) */
function pingRun(a,raw){
  const t=String(argOf(a,'TargetName')||firstArg(raw)||'localhost');
  const seq=[line('','PING '+t+' (10.6.10.6) 56(84) bytes of data.')], ms=[];
  for(let i=0;i<4;i++){ const v=(Math.random()*8+3); ms.push(v);
    seq.push(line('','64 bytes from 10.6.10.6: icmp_seq='+(i+1)+' ttl=64 time='+v.toFixed(1)+' ms')); }
  const mn=Math.min.apply(null,ms), mx=Math.max.apply(null,ms);
  const avg=ms.reduce(function(s,v){return s+v;},0)/ms.length;                     /* 平均,不是中程值 */
  const mdev=Math.sqrt(ms.reduce(function(s,v){return s+(v-avg)*(v-avg);},0)/ms.length);
  seq.push(line(''),line('','--- '+t+' ping statistics ---'),
    line('','4 packets transmitted, 4 received, 0% packet loss, time 3005ms'),
    line('','rtt min/avg/max/mdev = '+mn.toFixed(3)+'/'+avg.toFixed(3)+'/'+mx.toFixed(3)+'/'+mdev.toFixed(3)+' ms'));
  asyncPrint(seq,180); return null;
}

function tokClass(t,first){

  if(/^-/.test(t)) return 'param';
  if(/^([|><=]|>>)$/.test(t)) return 'op';

  let first=true;

    const t=toks[i], cls=tokClass(t,first);
    if(cls){ const sp=document.createElement('span'); sp.className=cls; sp.textContent=t; parent.appendChild(sp); }
    else parent.appendChild(document.createTextNode(t));

function edRenderBar(){
  edBar.textContent='';

    edBar.className='ed-bar'; edBar.hidden=false;   /* vim 在桌機會把它藏起來,切回 nano 一定要復原 */
    NANOKEYS.forEach(function(it){
      const b=document.createElement('button'); b.type='button'; b.tabIndex=-1;   /* footer 是 ^O/^X 的視覺提示+觸控替代,不佔鍵盤 Tab 序 */
      const k=document.createElement('span'); k.className='k'; k.textContent=it[0];
      b.appendChild(k); b.appendChild(document.createTextNode(' '+it[1]));

  edBar.className='ed-bar vimbar';

  [['Esc',function(){ edVimToNormal(); }],

   [':w',function(){ edVimEx('w'); }],
   [':wq',function(){ edVimEx('wq'); }],
   [':q!',function(){ edVimEx('q!'); }]].forEach(function(it){
    const b=document.createElement('button'); b.type='button'; b.tabIndex=-1; b.textContent=it[0];
    b.addEventListener('mousedown',function(ev){ ev.preventDefault(); });

function edFocusBuf(){ try{ edTa.focus({preventScroll:true}); }catch(e){ try{edTa.focus();}catch(_){} } }

function edStart(app,arg){
  const rel=arg||'';

  if(rel){
    p=resolvePath(rel); node=fsGet(p); name=rel;
    if(node&&node.t==='d'){
      return app==='nano' ? [line('err','Error reading '+rel+': Is a directory')]
                          : [line('err','"'+rel+'" is a directory')];
    }
    const par=fsParent(p);
    if(!node&&(!par||par.t!=='d'))
      return [line('err',app+': '+rel+': No such file or directory')];
  }
  ED.open=true; ED.app=app; ED.path=p; ED.name=name; ED.dirty=false;
  ED.isNew=!node; ED.undo=[]; ED.pending=''; ED.wantCol=null; ED.onPrompt=null;
  ED.mode = app==='vim' ? 'normal' : 'insert';

  ED.ro = !!(node && ownerOf(node)!==USERNAME);

  edTa.value=ls.join('\n');
  edTa.readOnly=false;
  edTa.classList.toggle('ro', app==='vim');
  edEl.hidden=false;
  edRenderTop(); edRenderBar(); edRenderTilde();
  if(app==='nano'){
    edSetMsg(!rel ? 'New Buffer'
      : ED.isNew ? 'New File'
      : '[ Read '+ls.length+' line'+(ls.length===1?'':'s')+' ]', true);
  } else {
    edSetMsg(!rel ? '' : '"'+name+'" '+(ED.isNew?'[New]'
      :(ED.ro?'[readonly] ':'')+ls.length+'L, '+fsSize(node)+'B'));

}
function edClose(){
  ED.open=false; edEl.hidden=true; edTa.value=''; edPr.hidden=true;

/* 寫入:回傳 {lines,bytes,warn} 或 {err:...} */
function edWrite(target){
  const rel=target||ED.name;
  if(!rel) return {err:'nofile'};
  const p=resolvePath(rel), node=fsGet(p), par=fsParent(p);
  if(node&&node.t==='d') return {err:'isdir'};
  if(!par||par.t!=='d') return {err:'nodir'};
  if(node ? ownerOf(node)!==USERNAME : !writable(par)) return {err:'perm'};
  const ls=edLines();
  let n=node;
  if(!n){ n=stamp(fnode(null,false,ls.slice())); setChild(par,baseOf(p),n); }
  else { if(n.seed){ n.seed=false; n.rows=null; } n.text=ls.slice(); stamp(n); }
  const warn=fsSave();
  /* 兩個編輯器對「另存新檔」的語意不同,不能混:
     nano 的 ^O 換檔名 = 緩衝區改綁新檔(標題列跟著變);
     vim 的 :w foo 只是另存一份副本,目前緩衝區仍是原檔 —— 所以「未存檔」旗標
     絕對不能清掉,否則接著 :q 會靜默丟掉原檔真正的修改。 */
  const cur=ED.name?resolvePath(ED.name):'';
  const rebind=(ED.app==='nano')||!cur;
  const wroteCurrent=!target||samePath(p,cur);
  if(rebind){ ED.name=rel; ED.ro=ownerOf(n)!==USERNAME; }
  if(rebind||wroteCurrent){ ED.dirty=false; ED.isNew=false; }
  return {lines:ls.length,bytes:edBytes(),warn:warn};
}
/* 在游標處插入文字(Tab 用)。textarea 預設會把 Tab 當成切換焦點,
   但編輯器裡的 Tab 就該是縮排。 */
function edInsert(s){ const st=edTa.selectionStart, en=edTa.selectionEnd, v=edTa.value;
  edTa.value=v.slice(0,st)+s+v.slice(en);
  try{ edTa.setSelectionRange(st+s.length,st+s.length); }catch(e){}
  edTouch(); edRenderTilde(); }
/* 共用的單行輸入(nano 的 ^O 檔名、^W 搜尋;vim 的 : 命令列)。
   用真的 <input> 而不是攔鍵盤 —— 手機軟鍵盤才打得進去。 */
function edAsk(label,initial,cb){
  ED.onPrompt=cb; edPrLab.textContent=label; edPrIn.value=initial||'';
  edPrIn.setAttribute('aria-label',label.replace(/\s+$/,''));
  edPr.hidden=false;
  try{ edPrIn.focus(); edPrIn.setSelectionRange(edPrIn.value.length,edPrIn.value.length); }catch(e){}
}
function edAskDone(ok){
  const cb=ED.onPrompt, v=edPrIn.value;
  ED.onPrompt=null; edPr.hidden=true; edFocusBuf();
  if(cb) cb(ok?v:null);

/* ===== nano ===== */
function edNanoDo(what){
  /* 正在回答提示時忽略快捷列 —— 否則會把待處理的 callback 換掉,
     使用者以為在回答「存成什麼檔名」,結果答到了「要不要放棄變更」。 */
  if(ED.onPrompt) return;
  if(what==='exit') return edNanoExit();
  if(what==='write') return edNanoWrite();
  if(what==='cut'){ edMark(); const P=edPos(), b=edLineBounds(P.v,P.row);
    ED.cut=P.v.slice(b.start,b.end);
    edTa.value=P.v.slice(0,b.start)+P.v.slice(Math.min(P.v.length,b.end+1));
    try{ edTa.setSelectionRange(b.start,b.start); }catch(e){}
    edTouch(); edRenderTilde(); edSetMsg(''); return; }
  if(what==='paste'){ if(!ED.cut){ edSetMsg('Cutbuffer is empty',true); return; }
    edMark(); const P=edPos(), b=edLineBounds(P.v,P.row);
    edTa.value=P.v.slice(0,b.start)+ED.cut+'\n'+P.v.slice(b.start);
    try{ edTa.setSelectionRange(b.start,b.start); }catch(e){}
    edTouch(); edRenderTilde(); edSetMsg(''); return; }
  if(what==='loc'){ const P=edPos(), ls=edLines(), ch=P.c+1, tot=edTa.value.length+1;
    edSetMsg('line '+(P.row+1)+'/'+ls.length+' ('+Math.round((P.row+1)/ls.length*100)+'%), '+
      'col '+(P.col+1)+'/'+(ls[P.row]||'').length+', char '+ch+'/'+tot,true); return; }
  if(what==='goto'){ edAsk('Enter line number, column number: ','',function(v){
      if(v==null){ edSetMsg('Cancelled',true); return; }
      const nn=parseInt(String(v).split(/[ ,]/)[0],10);
      if(!nn||nn<1){ edSetMsg('Invalid line number',true); return; }
      const ls=edLines(), row=Math.min(nn,ls.length)-1, b=edLineBounds(edTa.value,row);
      try{ edTa.setSelectionRange(b.start,b.start); }catch(e){}
      edSetMsg(''); }); return; }
  if(what==='find'){ edAsk('Search: ','',function(v){
      if(v==null||v===''){ edSetMsg('Cancelled',true); return; }
      const from=edTa.selectionStart+1, hay=edTa.value;
      let i=hay.indexOf(v,from); if(i<0) i=hay.indexOf(v,0);
      if(i<0){ edSetMsg('"'+v+'" not found',true); return; }
      try{ edTa.setSelectionRange(i,i+v.length); }catch(e){}
      edSetMsg(''); }); return; }
  if(what==='help'){ edSetMsg('^O write out  ^X exit  ^K cut  ^U paste  ^C location  ^/ go to line',true); return; }
  edSetMsg('Unavailable in this sandbox',true);
}
function edNanoWrite(){
  edAsk('File Name to Write: ',ED.name,function(v){
    if(v==null){ edSetMsg('Cancelled',true); return; }
    if(!v){ edSetMsg('Cancelled',true); return; }
    const r=edWrite(v);
    if(r.err==='perm'){ edSetMsg('Error writing '+v+': Permission denied',true); return; }
    if(r.err==='isdir'){ edSetMsg('Error writing '+v+': Is a directory',true); return; }
    if(r.err==='nodir'){ edSetMsg('Error writing '+v+': No such file or directory',true); return; }
    edRenderTop();
    edSetMsg(r.warn ? 'Error writing '+v+': storage unavailable'
      : '[ Wrote '+r.lines+' line'+(r.lines===1?'':'s')+' ]', true);
  });
}
function edNanoExit(){
  if(!ED.dirty) return edClose();
  edAsk('Save modified buffer?  (Answering "No" will DISCARD changes.)  [Y/N] ','',function(v){
    if(v==null){ edSetMsg('Cancelled',true); return; }
    const a=String(v).trim().toLowerCase();
    if(a==='n'||a==='no') return edClose();
    if(a==='y'||a==='yes'||a===''){
      if(!ED.name){ edAsk('File Name to Write: ','',function(nm){
          if(nm==null||!nm){ edSetMsg('Cancelled',true); return; }
          const r2=edWrite(nm); if(r2.err){ edSetMsg('Error writing '+nm+': '+
            (r2.err==='perm'?'Permission denied':'cannot write'),true); return; }
          edClose(); }); return; }
      const r=edWrite(ED.name);
      if(r.err){ edSetMsg('Error writing '+ED.name+': '+
        (r.err==='perm'?'Permission denied':'cannot write'),true); return; }
      return edClose(); }
    edSetMsg('Cancelled',true);
  });
}
function edNanoKey(e){
  if(e.key==='Tab'&&!e.ctrlKey&&!e.altKey&&!e.metaKey){ e.preventDefault(); edInsert('\t'); return; }
  if(!e.ctrlKey||e.altKey||e.metaKey) return;
  const c=String(e.key).toLowerCase();
  /* ^W / ^T 是瀏覽器保留鍵,攔不住,只走底部按鈕 */
  if(c==='o'){ e.preventDefault(); edNanoDo('write'); return; }
  if(c==='x'){ e.preventDefault(); edNanoDo('exit'); return; }
  if(c==='k'){ e.preventDefault(); edNanoDo('cut'); return; }
  if(c==='u'){ e.preventDefault(); edNanoDo('paste'); return; }
  if(c==='g'){ e.preventDefault(); edNanoDo('help'); return; }
  if(c==='_'||c==='/'){ e.preventDefault(); edNanoDo('goto'); return; }
  /* 有選取時讓 Ctrl+C 走瀏覽器的複製,沒選取才是 nano 的 Location */
  if(c==='c'&&!String(getSelection())){ e.preventDefault(); edNanoDo('loc'); return; }
}

/* ===== vim ===== */
function edPos(){ const v=edTa.value, c=edTa.selectionStart||0, before=v.slice(0,c);
  const nl=before.lastIndexOf('\n');
  return {v:v,c:c,row:before.split('\n').length-1,col:c-(nl+1)}; }
function edLineBounds(v,row){ const ls=v.split('\n'); let s=0;
  for(let i=0;i<row&&i<ls.length;i++) s+=ls[i].length+1;
  return {start:s,end:s+(ls[row]||'').length,lines:ls}; }
function edGo(row,col){ const ls=edLines();
  row=Math.max(0,Math.min(row,ls.length-1));
  col=Math.max(0,Math.min(col,ls[row].length));
  const b=edLineBounds(edTa.value,row);
  try{ edTa.setSelectionRange(b.start+col,b.start+col); }catch(e){}
  edRenderTilde(); }
function edVimToInsert(){ if(ED.ro){ edSetMsg("W10: Warning: Changing a readonly file"); }
  edMark(); ED.mode='insert'; edTa.classList.remove('ro'); edSetMsg('-- INSERT --'); }
function edVimToNormal(){ ED.mode='normal'; ED.pending=''; edTa.classList.add('ro'); edSetMsg('');
  const P=edPos(); if(P.col>0) edGo(P.row,P.col-1); }
function edVimEx(cmd){
  const m=String(cmd).trim();
  if(/^\d+$/.test(m)){ edGo(parseInt(m,10)-1,0); return; }
  const mm=m.match(/^(w|wq|x|q)(!?)(?:\s+(.+))?$/);
  if(!mm){ edSetMsg('E492: Not an editor command: '+m); return; }
  const verb=mm[1], bang=mm[2]==='!', target=mm[3]&&mm[3].trim();
  if(verb==='q'){
    if(ED.dirty&&!bang){ edSetMsg('E37: No write since last change (add ! to override)'); return; }
    return edClose(); }
  if(ED.ro&&!bang&&!target){ edSetMsg("E45: 'readonly' option is set (add ! to override)"); return; }
  const r=edWrite(target);
  if(r.err==='nofile'){ edSetMsg('E32: No file name'); return; }
  if(r.err==='perm'){ edSetMsg("E212: Can't open file for writing"); return; }
  if(r.err==='isdir'||r.err==='nodir'){ edSetMsg("E212: Can't open file for writing"); return; }
  edSetMsg(r.warn ? "E212: Can't open file for writing"
    : '"'+(target||ED.name)+'" '+r.lines+'L, '+r.bytes+'B written');
  if(verb==='wq'||verb==='x'){ if(!r.warn) edClose(); }
}
function edVimNormalKey(k){
  const P=edPos(), ls=edLines();
  if(ED.pending==='d'){ ED.pending='';
    if(k==='d'){ edMark(); const b=edLineBounds(P.v,P.row);
      ED.cut=P.v.slice(b.start,b.end);
      edTa.value=ls.length===1?'':P.v.slice(0,b.start)+P.v.slice(Math.min(P.v.length,b.end+1));
      edTouch(); edGo(Math.min(P.row,edLines().length-1),0); }
    return; }
  if(ED.pending==='g'){ ED.pending=''; if(k==='g') edGo(0,0); return; }
  if(ED.pending==='y'){ ED.pending='';
    if(k==='y'){ const b=edLineBounds(P.v,P.row); ED.cut=P.v.slice(b.start,b.end); }
    return; }
  switch(k){
    case 'i': return edVimToInsert();
    case 'a': edGo(P.row,P.col+1); return edVimToInsert();
    case 'I': edGo(P.row,0); return edVimToInsert();
    case 'A': edGo(P.row,(ls[P.row]||'').length); return edVimToInsert();
    case 'o': { edMark(); const b=edLineBounds(P.v,P.row);
      edTa.value=P.v.slice(0,b.end)+'\n'+P.v.slice(b.end);
      edTouch(); edGo(P.row+1,0); return edVimToInsert(); }
    case 'O': { edMark(); const b=edLineBounds(P.v,P.row);
      edTa.value=P.v.slice(0,b.start)+'\n'+P.v.slice(b.start);
      edTouch(); edGo(P.row,0); return edVimToInsert(); }
    case 'h': return edGo(P.row,P.col-1);
    case 'l': return edGo(P.row,P.col+1);
    case 'j': return edGo(P.row+1,P.col);
    case 'k': return edGo(P.row-1,P.col);
    case '0': return edGo(P.row,0);
    case '$': return edGo(P.row,(ls[P.row]||'').length);
    case 'G': return edGo(ls.length-1,0);
    /* 游標停在行尾時 x 不能動作 —— 真 vim 的 x 永遠不會把換行吃掉、把兩行併起來 */
    case 'x': { if(P.col>=(ls[P.row]||'').length) return; edMark();
      edTa.value=P.v.slice(0,P.c)+P.v.slice(P.c+1); edTouch(); edGo(P.row,P.col); return; }
    case 'p': { if(!ED.cut) return; edMark(); const b=edLineBounds(P.v,P.row);
      edTa.value=P.v.slice(0,b.end)+'\n'+ED.cut+P.v.slice(b.end);
      edTouch(); edGo(P.row+1,0); return; }
    case 'u': { if(!ED.undo.length){ edSetMsg('Already at oldest change'); return; }
      const s=ED.undo.pop(); edTa.value=s.v;
      try{ edTa.setSelectionRange(s.c,s.c); }catch(e){}
      edTouch(); edRenderTilde(); edSetMsg('1 change; before'); return; }
    case 'd': case 'g': case 'y': ED.pending=k; return;
    case ':': edAsk(':','',function(v){ if(v==null){ edSetMsg(''); return; } edVimEx(v); }); return;
  }
}
function edVimKey(e){
  if(ED.mode==='insert'){
    if(e.key==='Escape'){ e.preventDefault(); edVimToNormal(); return; }
    if(e.key==='Tab'){ e.preventDefault(); edInsert('\t'); return; }
    return; }
  const k=e.key;
  if(k==='Escape'){ e.preventDefault(); ED.pending=''; edSetMsg(''); return; }
  if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Home','End','PageUp','PageDown'].indexOf(k)>=0) return;
  if(k.length===1&&!e.ctrlKey&&!e.metaKey&&!e.altKey){ e.preventDefault(); edVimNormalKey(k); return; }
  if(k==='Enter'||k==='Backspace'||k==='Delete'||k==='Tab'){ e.preventDefault(); }
}
edTa.addEventListener('keydown',function(e){
  if(!ED.open) return;
  if(e.isComposing||e.keyCode===229) return;   /* IME 組字中一律交還輸入法 */
  if(ED.app==='nano') edNanoKey(e); else edVimKey(e);

/* 一律標記 dirty,不看模式:手機軟鍵盤在 vim 的 normal 模式仍可能塞進字元
   (行動裝置的 keydown 給不出可靠的鍵值,攔不乾淨),漏標就會在 :q 時靜默丟失內容。
   normal 模式下由程式改 value 不會觸發 input,所以不會重複計算。 */
edTa.addEventListener('input',function(){
  if(!ED.open) return;

});
edTa.addEventListener('scroll',function(){ if(ED.app==='vim') edTil.scrollTop=edTa.scrollTop; });
edPrIn.addEventListener('keydown',function(e){
  if(e.isComposing||e.keyCode===229) return;
  if(e.key==='Enter'){ e.preventDefault(); edAskDone(true); return; }
  if(e.key==='Escape'||((e.ctrlKey||e.metaKey)&&String(e.key).toLowerCase()==='c')){
    e.preventDefault(); edAskDone(false); return; }
});

/* ---------- 事件 ---------- */
function onKey(e){
  /* IME 組字中(注音/倉頡/日文/韓文):所有按鍵都交還給輸入法。
     Enter 是選字確認、↑↓ 與 Tab 是候選字操作,一律不可攔截。
     三重判斷:標準 isComposing、composition 事件旗標(舊 Safari/部分 Android IME 不可靠)、
     以及 IME 組字期間的哨兵 keyCode 229。 */
  if(e.isComposing || composing || e.keyCode===229) return;
  let k=e.key;
  if(menu.open){
    if(k==='Tab'||k==='ArrowDown'){ e.preventDefault(); menu.idx=(menu.idx+1)%menu.items.length; applyMenuPick(); renderMenu(); return; }
    if(k==='ArrowUp'){ e.preventDefault(); menu.idx=(menu.idx-1+menu.items.length)%menu.items.length; applyMenuPick(); renderMenu(); return; }
    if(k==='Enter'){ e.preventDefault(); closeMenu(); return; }            // 接受目前候選
    if(k==='Escape'){ e.preventDefault();                                   // 取消並還原開啟前的輸入
      const o=menu.orig, c=menu.origCaret; closeMenu();
      if(o!=null) setVal(o,c); return; }
    closeMenu();
  }
  if(k==='Enter'){ e.preventDefault(); if(busy) return; run(); return; }
  if(k==='Tab'){ if(!val()){ return; } e.preventDefault(); openOrCycle(); return; }
  if(k==='ArrowRight'||k==='End'){ if(atEnd()&&acceptPrediction()){ e.preventDefault(); } return; }
  if(k==='ArrowUp'){ e.preventDefault(); histNav(-1); return; }
  if(k==='ArrowDown'){ e.preventDefault(); histNav(1); return; }
  if((e.ctrlKey||e.metaKey)&&(k==='l'||k==='L')){ e.preventDefault(); clearOut(); scrollBottom(); return; }
  if((e.ctrlKey||e.metaKey)&&(k==='c'||k==='C')){ if(String(getSelection())) return; e.preventDefault(); printPrompt(val()); setVal(''); return; }
  if(k==='Escape'){ if(val()){ e.preventDefault(); setVal(''); } else { edit.blur(); } return; }
  /* 其餘按鍵交給原生 textarea 處理(手機軟鍵盤/貼上皆走 input 事件)*/
}
function focusEdit(){ if(ED.open) return;   /* 編輯器開著時不可把焦點搶回命令列 */
  try{ edit.focus({preventScroll:true}); }catch(e){ try{edit.focus();}catch(_){} } }
edit.addEventListener('keydown',onKey);
edit.addEventListener('compositionstart',function(){ composing=true; if(menu.open) closeMenu(); sync(); });
edit.addEventListener('compositionend',function(){ composing=false; sync(); });
edit.addEventListener('input',function(){ if(menu.open) closeMenu(); hIdx=null; sync(); });
edit.addEventListener('click',sync);

con.addEventListener('click',function(e){

/* ---------- 開場 ---------- */
function boot(){
